metaDescription: 'Zahlterminal mieten oder kaufen: Entscheidung nach Nutzungsdauer, Einsatzort und Risiko, Leistungen in der Miete, Terminalwechsel 2027 und Buchhaltung.'
kicker: Wissen
lead: Die Miete kostet mehr, wenn das Terminal lange läuft. Der Kauf kostet mehr, wenn es ausfällt oder die Zulassung verliert. Die Abwägung dazu auf einer Seite.
intro: |
  Ein Terminal kann man mieten oder kaufen, und beides ist über ibis payment möglich. Die Frage ist nicht, was günstiger ist, sondern über welchen Zeitraum, mit welchem Risiko und mit welcher Leistung dahinter. Wer nur Mietpreis mal Monate gegen Kaufpreis rechnet, lässt weg, was in der Miete steckt und was beim Kauf dazukommt.

  Dazu kommt der Zeitpunkt. Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung, weil die Kartenorganisationen neue Sicherheitsanforderungen durchsetzen. Wer heute kauft, sollte ein aktuelles Terminal kaufen, das diese Anforderungen erfüllt. Wer ein älteres Modell besitzt, sollte die Restnutzungsdauer kennen, bevor er in den Vergleich einsteigt.

  Preise für Miete und Kauf nennen wir nicht auf der Website. Sie stehen in der Offerte, beide Varianten nebeneinander. Anfragen können Sie über [Kontakt](/kontakt).
sections:
  - heading: Was zur Miete gehört
    body: |
      Bei der Miete zahlen Sie einen festen Betrag pro Monat, und das Terminal bleibt Sache des Vermieters. Üblich ist, dass der Service im Paket steckt: Wartung, Software-Updates und eine Regelung für den Fall, dass das Terminal ausfällt. Ob und wie das bei Ihrem Angebot gilt, steht in der Offerte. Lesen Sie diese Punkte nach, bevor Sie Mietpreise vergleichen. Eine tiefe Miete ohne Service ist ein anderes Produkt.

      Der zweite Vorteil ist die Flexibilität. Wer mietet, bindet kein Kapital und besitzt kein Terminal, das nach einer Umstellung oder am Ende der Saison nicht mehr gebraucht wird. Wie flexibel die Miete wirklich ist, entscheiden Laufzeit und Kündigung. Sie stehen im Vertrag mit SwiPay; wir zeigen sie Ihnen vor der Unterschrift.

      Mieten können Sie mobile Terminals wie den [PayTec N62](/geraete/paytec-n62) ebenso wie stationäre wie den [PayTec V3CT3](/geraete/paytec-v3ct3). Die Übersicht steht unter [Geräte](/geraete).
  - heading: Was beim Kauf dazugehört und was die Garantie deckt
    body: |
      Beim Kauf zahlen Sie einmal, und das Terminal gehört Ihnen. Sie bilanzieren es und entscheiden selbst, wie lange Sie es nutzen. Die Kehrseite: Was mit dem Terminal passiert, ist Ihre Sache. Eine Garantie deckt in der Regel Material- und Herstellungsfehler, nicht Sturz, Flüssigkeit, Akkuverschleiss oder Verlust. Wie lange sie läuft und was sie umfasst, steht in der Offerte.

      Auch ein gekauftes Terminal braucht Updates, damit es zugelassen bleibt. Fragen Sie, wie sie verteilt werden. Und klären Sie, was bei einem Defekt ausserhalb der Garantie passiert: Dann kaufen oder mieten Sie Ersatz. Die Gebühren pro Zahlung fallen bei Miete und Kauf an und richten sich nach Umsatz und Kartenmix.

      Mobile Terminals in der Schürze oder am Marktstand im Regen haben ein höheres Ausfallrisiko als ein Tischterminal am Kabel. Faustregel: mobile Terminals mieten, stationäre kaufen, wenn die Nutzungsdauer sicher ist. Wer beides hat, kann beides machen, ein gekaufter CT20P an der Kasse und ein gemieteter N62 für die Beratung am Regal.
  - heading: So vergleichen Sie Miete und Kauf
    body: |
      Die Rechnung selbst ist einfach, die Zahlen dazu stehen in Ihrer Offerte. Teilen Sie den Kaufpreis durch die Monatsmiete desselben Modells. Das Ergebnis ist die Anzahl Monate, nach der die bezahlte Miete den Kaufpreis erreicht.

      Diese Zahl allein reicht nicht. Auf der Seite der Miete fehlt in der Rechnung, was im Mietpreis an Service steckt. Auf der Seite des Kaufs fehlt das Risiko: ein Defekt ausserhalb der Garantie, ein Modell, das nicht mehr zum Ablauf passt, eine neue Sicherheitsanforderung. Ein einziger Ersatz dreht die Rechnung.

      Stellen Sie darum vier Fragen an die Offerte:

      - Was kostet dasselbe Modell in Miete und in Kauf?
      - Welche Leistungen sind im Mietpreis enthalten, und was kosten sie beim Kauf separat?
      - Wie lange läuft die Garantie, und was deckt sie?
      - Welche Laufzeit und welche Kündigungsfrist gelten für die Miete?

      Der Kauf ist vor allem für Betriebe sinnvoll, die das Terminal stationär und geschützt einsetzen und sicher sind, dass sie es über Jahre brauchen.
  - heading: Terminalwechsel 2027
    body: |
      Die Kartenorganisationen setzen neue Sicherheitsanforderungen durch, und viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung. Für die Entscheidung heisst das zweierlei. Wer ein älteres Terminal besitzt, sollte beim Anbieter schriftlich nachfragen, bis wann es zugelassen bleibt, und die Restnutzungsdauer in den Vergleich einrechnen. Ein Kauf, der bald nicht mehr nutzbar ist, rechnet sich nicht.

      Wer heute kauft, sollte ein aktuelles Modell wählen; die PayTec-Terminals, die wir vermitteln, sind nach PCI PTS 6.x zertifiziert und ep2-zugelassen. Wer mietet, besitzt kein Terminal, das er bei einer künftigen Anforderung auf eigene Kosten ersetzen muss. Wie Updates und Austausch bei der Miete geregelt sind, steht in der Offerte. Wer das Risiko einer künftigen Anforderung nicht selbst tragen will, mietet.
  - heading: Steuern und Buchhaltung
    body: |
      Beim Kauf wird das Terminal aktiviert und über die Nutzungsdauer abgeschrieben, die Miete wird im Monat, in dem sie anfällt, als Aufwand verbucht. Für kleine Beträge gibt es in vielen Betrieben eine Grenze, unterhalb der ein Kauf direkt als Aufwand gebucht wird; ob das bei Ihnen gilt, hängt von Ihrer Buchhaltungspraxis ab. Die Mehrwertsteuer ist in beiden Fällen als Vorsteuer abziehbar, sofern der Betrieb mehrwertsteuerpflichtig ist.

      Welche Variante für Ihre Steuersituation passt, klären Sie mit Ihrem Treuhänder. Wir liefern dafür die Offerte mit beiden Varianten. Wer keinen Treuhänder hat, findet mehr unter [Treuhand](/dienstleistungen/treuhand).
  - heading: Entscheidungshilfe
    body: |
      Mieten, wenn das Terminal mobil eingesetzt wird, die Nutzungsdauer unsicher ist, der Betrieb saisonal arbeitet oder Sie das Risiko von Defekt und Zulassung nicht tragen wollen. Kaufen, wenn das Terminal stationär und geschützt steht, Sie es über Jahre brauchen und die Liquidität für den Kaufpreis da ist. Bei mehreren Terminals lohnt sich die Mischung.

      Die Gebühren pro Zahlung fallen in beiden Fällen an: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte. Den Vertrag schliessen Sie mit der SwiPay AG; ibis berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Die Übersicht steht unter [Konditionen](/konditionen). Die Offerte mit Miete und Kauf nebeneinander erhalten Sie über [Kontakt](/kontakt).
