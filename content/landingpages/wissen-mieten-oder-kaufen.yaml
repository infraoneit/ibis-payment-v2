faq:
  - frage: Ab wann ist der Kauf günstiger als die Miete?
    antwort: |
      Das hängt vom Verhältnis zwischen Kaufpreis und Monatsmiete ab; beide stehen in der Offerte. Teilen Sie den Kaufpreis durch die Monatsmiete, dann kennen Sie die Anzahl Monate. Nicht eingerechnet sind dabei der Service, der in der Miete steckt, und das Defektrisiko beim Kauf.
  - frage: Was passiert, wenn ein gekauftes Terminal kaputtgeht?
    antwort: |
      Eine Garantie greift in der Regel bei Material- und Herstellungsfehlern; Dauer und Umfang stehen in der Offerte. Ausserhalb der Garantie, etwa bei Sturz oder Flüssigkeit, kaufen oder mieten Sie Ersatz. Wie ein Defekt bei der Miete geregelt ist, steht ebenfalls in der Offerte.
  - frage: Bekommt ein gekauftes Terminal Updates?
    antwort: |
      Ein Terminal braucht Updates, damit es zugelassen bleibt, ob gekauft oder gemietet. Wie sie bei einem gekauften Terminal verteilt werden, steht in der Offerte. Fragen Sie vor dem Kauf danach.
  - frage: Kann ich von Miete auf Kauf wechseln?
    antwort: |
      Ob das gemietete Terminal übernommen werden kann und ob bezahlte Mieten angerechnet werden, klären wir in der Offerte. Laufzeit und Kündigung der Miete stehen im Vertrag mit SwiPay; wir zeigen sie Ihnen vor der Unterschrift.
  - frage: Ändert sich die Gebühr pro Zahlung, wenn ich kaufe?
    antwort: |
      Nein, die Gebühren pro Zahlung richten sich nach Umsatz und Kartenmix. Der Unterschied zwischen Miete und Kauf liegt bei den Gerätekosten. Die genauen Sätze stehen in der Offerte.
  - frage: Wie buche ich Miete und Kauf?
    antwort: |
      Die Miete ist monatlicher Aufwand. Der Kauf wird aktiviert und abgeschrieben oder, je nach Praxis des Betriebs, bei kleinen Beträgen direkt als Aufwand gebucht. Klären Sie das mit Ihrem Treuhänder.
