kicker: Branche
lead: Ein Terminal mit Akku und 4G, das ohne Steckdose und ohne WLAN den Markttag durchhält. Ob Miete, Kauf oder Handy als Terminal passt, klären wir vor der Unterschrift.
intro: |
  Am Marktstand gibt es keine Steckdose und meist kein WLAN. Die Beträge sind klein, die Schlange ist lang, und wer kein Bargeld dabei hat, geht zum nächsten Stand. Das Terminal muss in die Jackentasche passen, einen Tag mit einer Akkuladung auskommen und über das Mobilfunknetz zahlen.

  Dazu kommt die Kostenfrage. Bei kleinen Beträgen fällt jede Gebühr pro Zahlung ins Gewicht, und ein Stand, der nur von April bis Oktober verkauft, will wissen, was in den Wintermonaten gilt. Beides lässt sich vor der Unterschrift klären.

  Wie der Preis zustande kommt, steht unter [Konditionen](/konditionen), die Offerte erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: Betrag eintippen, Karte vorhalten, nächster Kunde
    body: |
      Am Stand gibt es keine Kasse, der Betrag wird eingetippt. Der Kunde hält Karte oder Handy an das Terminal, bei Kleinbeträgen meist ohne PIN. Einen Beleg verlangt am Markt kaum jemand; wer einen will, scannt den QR-Code auf dem Display oder erhält ihn per SMS.

      TWINT läuft direkt auf dem Terminal, ohne QR-Aufsteller, der bei Wind umfällt. Apple Pay und Google Pay werden wie die hinterlegte Karte abgerechnet. Für einen Stand mit zwei Verkäufern reicht oft ein Terminal. Ob ein zweites nötig ist, zeigt sich nach den ersten Markttagen.
  - heading: N62 mit Akku, 4G und ohne Drucker
    body: |
      Der [PayTec N62](/geraete/paytec-n62) passt zum Stand. Er wiegt 176 Gramm, hat ein 4-Zoll-Touchdisplay und keinen Drucker, also auch keine Papierrolle, die ausgeht. Verbunden ist er über 4G, WLAN braucht es nicht. Der Akku schafft laut Datenblatt über 550 Zahlungen und mehr als 14 Stunden Bildschirmzeit pro Ladung, die Ladezeit beträgt 2.5 Stunden. Das Gehäuse ist für Stürze aus 1.5 Metern und Temperaturen von 0 bis 50 Grad ausgelegt.

      Das Terminal gibt es als Miete oder Kauf. Der Preis und was in der Miete enthalten ist, stehen in der Offerte.

      Wer am Event gedruckte Belege braucht, etwa in der Festwirtschaft, nimmt den [PayTec N86](/geraete/paytec-n86) mit Drucker, grösserem Akku und über 600 Belegen pro Ladung.
  - heading: Handy als Terminal, als Einstieg oder als Reserve
    body: |
      Wer nur an wenigen Markttagen pro Jahr verkauft, kann mit dem Smartphone starten. Mit der App Softpay wird das Handy zum Terminal und nimmt Visa, Mastercard, American Express, Apple Pay und Google Pay kontaktlos an. Es gibt kein Terminal zu mieten und nichts zu laden ausser dem Handy, das ohnehin dabei ist.

      Zwei Einschränkungen muss man kennen: TWINT und PostFinance Card funktionieren über die App nicht, und beides wird am Markt oft gezückt. Deshalb empfehlen wir das Handy als Einstieg, um zu sehen, wie viel Kartenumsatz überhaupt zusammenkommt, oder als Reserve neben dem N62, wenn dessen Akku leer ist oder eine zweite Linie gebraucht wird. Details unter [Handy als Terminal](/handy-als-terminal).
  - heading: Kleine Beträge, genauer Blick auf die Gebühr
    body: |
      Am Markt sind die Beträge klein. Jede Gebühr, die pro Zahlung anfällt, wiegt bei einem kleinen Betrag schwerer als bei einem grossen. Wer viele kleine Beträge hat, schaut deshalb nicht nur auf den Prozentsatz, sondern rechnet mit dem eigenen Durchschnittsbetrag.

      Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte, ebenso der Satz für TWINT und alle weiteren Positionen.

      Anbieter rechnen unterschiedlich ab: die einen nur mit einem Prozentsatz, andere zusätzlich mit einem festen Betrag pro Zahlung. Welche Variante bei Ihrem Durchschnittsbetrag günstiger ist, lässt sich nur mit Ihren Zahlen beantworten. Der [Rechner](/konditionen#rechner) zeigt es mit Ihren Werten; die Beispielrechnung auf dieser Seite rechnet mit den Annahmen für einen Stand mit kleinem Durchschnittsbetrag.
  - heading: Saisonbetrieb, Miete, Kauf oder Handy
    body: |
      Ein Stand, der im Winter geschlossen ist, braucht im Winter kein Terminal. Ob sich die Miete für die Wintermonate unterbrechen lässt, hängt von Laufzeit und Kündigung ab. Beides steht im Vertrag mit SwiPay, wir zeigen es Ihnen vor der Unterschrift. Sagen Sie uns bei der Anfrage, in welchen Monaten Sie verkaufen, dann berücksichtigen wir das in der Offerte.

      Wer das Terminal viele Jahre nutzt, kann es kaufen; der Preis steht in der Offerte. Was beim Kauf wegfällt und was dazukommt, steht unter [Mieten oder kaufen](/wissen/mieten-oder-kaufen). Für Standbetreiber mit einzelnen Events pro Jahr ist das Handy als Terminal die dritte Variante.
  - heading: Akku, Empfang, Gutschrift und Wechsel
    body: |
      Laden Sie den N62 am Vorabend, dann reicht die Ladung nach Datenblatt für den Markttag. In Hallen und Kellern prüfen Sie vor dem ersten Markttag den 4G-Empfang; wo WLAN vorhanden ist, nutzt das Terminal auch dieses. Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner, siehe [Support](/support).

      Die Umsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt. Die Abrechnung zeigt, über welchen Kanal sie kamen. Wenn Sie heute schon ein Terminal oder eine App nutzen, schicken Sie uns Ihre letzte Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Die Höchstsätze und den Rechner finden Sie unter [Konditionen](/konditionen).
