faq:
  - frage: Brauche ich am Stand WLAN?
    antwort: |
      Nein. Der N62 zahlt über 4G, WLAN nutzt er nur zusätzlich, wenn eines vorhanden ist. Ob die Datenverbindung im Angebot enthalten ist, steht in der Offerte.
  - frage: Was ist, wenn der Akku während des Markts leer ist?
    antwort: |
      Laut Datenblatt reicht eine Ladung für über 550 Zahlungen. Wer länger verkauft, lädt das Terminal in 2.5 Stunden wieder auf oder hält das Handy als Terminal als Reserve bereit.
  - frage: Kann ich das Terminal im Winter zurückgeben?
    antwort: |
      Das hängt von Laufzeit und Kündigung ab. Beides steht im Vertrag mit SwiPay, wir zeigen es Ihnen vor der Unterschrift. Sagen Sie uns bei der Anfrage, dass Sie nur saisonal verkaufen. Für wenige Markttage pro Jahr ist das Handy als Terminal eine Alternative.
  - frage: Reicht das Handy als Terminal für meinen Stand?
    antwort: |
      Für wenige Zahlungen und Kundschaft mit Visa oder Mastercard ja. TWINT und PostFinance Card gehen über das Handy nicht, und beides wird am Markt oft verlangt. Wer regelmässig verkauft, fährt mit dem N62 besser.
  - frage: Kann ich am Markt einen Beleg drucken?
    antwort: |
      Mit dem N62 nicht, er zeigt den Beleg als QR-Code oder schickt ihn per SMS oder E-Mail. Wer Papier braucht, nimmt den N86 mit eingebautem Drucker.
