metaDescription: 'Zahlterminal für Arztpraxis, Zahnarzt und Physiotherapie: Anbindung an die Praxissoftware, PIN-Pad am Empfang, keine Gesundheitsdaten auf dem Terminal.'
kicker: Branche
lead: Ein Terminal am Empfang, das den Betrag aus der Praxissoftware übernimmt, diskret bedient wird und nichts über die Behandlung weiss.
intro: |
  In der Praxis wird nach der Behandlung bezahlt: der Selbstzahler-Anteil, die Zahnarztrechnung in Teilbeträgen, die Physiotherapie ohne Verordnung, die kosmetische Behandlung. Die Beträge sind höher als an einer Ladenkasse, und die Zahlung findet am Empfang statt, wo die nächsten Patientinnen und Patienten bereits warten.

  Das stellt drei Anforderungen. Der Betrag soll aus der Praxissoftware kommen, damit Debitorenliste und Kartenabrechnung übereinstimmen. Die Zahlung soll diskret ablaufen, mit einem PIN-Pad, das der Patient selbst bedient. Und das Terminal darf nichts über die Behandlung wissen, weder auf dem Display noch auf dem Beleg.

  Wie der Preis zustande kommt, steht unter [Konditionen](/konditionen), die Offerte erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: Zahlen am Empfang, ohne Zuschauer
    body: |
      Die Behandlung ist abgeschlossen, die Praxissoftware erstellt die Rechnung. Wer direkt bezahlt, spart der Praxis Versand, Debitorenüberwachung und Mahnwesen. Der Betrag wird von der Software ans Terminal übergeben oder am Empfang eingetippt. Der Patient hält die Karte an das PIN-Pad, gibt bei höheren Beträgen die PIN ein, und der Beleg kommt aus dem Drucker, mit Praxisname, Betrag und Datum, ohne Angaben zur Leistung.

      Das PIN-Pad steht auf der Patientenseite. Der Patient bedient es selbst, das Personal sieht die PIN nicht, und die Karte wechselt nicht den Besitzer. In Zahnarztpraxen mit Teilzahlungen ist jede Teilzahlung eine eigene Kartenzahlung mit eigenem Beleg.
  - heading: CT20P mit Praxissoftware oder V3CT3 ohne Kasse
    body: |
      Für den Empfang mit Praxissoftware passt der [PayTec CT20P](/geraete/paytec-ct20p). Er ist kassenintegriert, hat ein physisches PIN-Pad mit 15 Tasten und fühlbaren Markierungen, das auch Menschen mit Sehbehinderung bedienen können, und hängt am LAN oder WLAN, auf Wunsch mit Strom über das Netzwerkkabel. Den Beleg druckt er über den Drucker, der am Empfang ohnehin steht. Ein Kensington-Schloss sichert ihn am Tresen.

      Für Praxen ohne anbindbare Software oder für den Zweitstandort reicht der [PayTec V3CT3](/geraete/paytec-v3ct3). Das Tischterminal hat Tastatur und eigenen Drucker, der Betrag wird eingetippt, optional mit dem Kunden-Pinpad P200 für die Patientenseite.

      Für Hausbesuche, Spitex und Therapeuten, die beim Patienten abrechnen, kommt der mobile [PayTec N62](/geraete/paytec-n62) mit 4G dazu. Alle Terminals gibt es als Miete oder Kauf, der Preis steht in der Offerte. Alle Modelle stehen unter [Geräte](/geraete).
  - heading: Anbindung an die Praxissoftware über OPI, ZVT oder KIT
    body: |
      Die Anbindung übergibt den Rechnungsbetrag von der Praxissoftware ans Terminal. Niemand tippt ab, die Zahlung wird in der Software als beglichen verbucht, und die Debitorenliste stimmt mit der Kartenabrechnung überein. In der Schweiz laufen diese Anbindungen über die Protokolle OPI, ZVT oder KIT. Der CT20P unterstützt alle drei, KIT auch über die Cloud.

      Ob Ihre Praxissoftware eines der Protokolle unterstützt, klären wir vor der Inbetriebnahme mit dem Softwareanbieter. ibis payment begleitet die Anbindung, bis die erste Zahlung aus der Software läuft. Praxen, die zusätzlich ein Kassensystem für Produkte oder Selbstzahlerleistungen suchen, finden die Systeme unter [Kassensysteme](/kassensysteme).
  - heading: Datenschutz, das Terminal kennt nur den Betrag
    body: |
      Das Terminal verarbeitet den Betrag und die Kartendaten, sonst nichts. Bei der Anbindung übergibt die Praxissoftware nur den Betrag und eine Referenz, keine Patientendaten und keine Leistungen. Alle Modelle sind nach PCI PTS 6.x zertifiziert und ep2-zugelassen. Auf dem Beleg stehen Praxisname, Betrag, Datum und die üblichen Zahlungsangaben, keine Behandlung.

      Die Zahlungsdaten gehen über das SwiPay-Bezahlnetzwerk an den Acquirer TeleCash/Fiserv. Gesundheitsdaten bleiben in der Praxissoftware. Für die Datenschutzerklärung der Praxis heisst das: Über das Zahlungssystem laufen keine besonders schützenswerten Daten.
  - heading: Höhere Beträge und was das für die Gebühr heisst
    body: |
      Bei höheren Beträgen zählt vor allem der Prozentsatz. Wird ein grosser Teil mit Kreditkarte bezahlt, prägt der Kreditsatz die Abrechnung. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte.

      In Praxen mit internationaler Kundschaft fallen ausländische Karten und Firmenkarten ins Gewicht. Welche Sätze dafür, für American Express und für TWINT gelten, steht ebenfalls in der Offerte. Der [Rechner](/konditionen#rechner) schätzt mit Ihrem Umsatz und Ihrem Durchschnittsbetrag die mögliche Ersparnis als Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite rechnet mit den dort genannten Annahmen für eine Praxis.
  - heading: Montagmorgen, Ausfall, Abrechnung und Wechsel
    body: |
      Am Montagmorgen und nach den Ferien stehen die Patienten am Empfang Schlange. Ein zweites Terminal an einem zweiten Arbeitsplatz entlastet. Der CT20P hängt am Kabel, nicht am WLAN, was in Praxen mit dicken Wänden die zuverlässigere Variante ist. Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner, siehe [Support](/support).

      Die Umsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt; die Abrechnung zeigt, über welchen Kanal sie kamen. Wenn Sie heute schon ein Terminal haben, schicken Sie uns die letzte Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Die Höchstsätze und den Rechner finden Sie unter [Konditionen](/konditionen).
