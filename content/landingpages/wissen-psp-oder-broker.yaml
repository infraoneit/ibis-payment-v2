navTitle: PSP oder Broker
metaTitle: PSP oder Payment Broker im Vergleich | ibis payment
metaDescription: 'PSP, Payment Broker oder Orchestrator: was jede Rolle tut, wann welches Modell passt, wie Vermittler bezahlt werden und welche Fragen Sie stellen sollten.'
kicker: Wissen
lead: Ein PSP betreibt die Technik, ein Broker vermittelt und ordnet ein, ein Orchestrator verteilt Zahlungen auf mehrere Anbieter. Drei Rollen, die oft verwechselt werden.
intro: |
  Wer ein Zahlterminal oder eine Online-Zahlung sucht, trifft auf Anbieter mit sehr unterschiedlichen Rollen, die alle «Payment» im Namen tragen. Die einen betreiben eine Plattform, über die Zahlungen laufen. Die anderen betreiben nichts, sondern kennen den Markt und vermitteln. Die dritten schalten mehrere Plattformen hintereinander und entscheiden pro Zahlung, welche sie nimmt.

  Für den Betrieb ist der Unterschied wichtig, weil er bestimmt, wer bei einem Problem zuständig ist, wer die Gebühr festlegt und wer woran verdient. Ein Vermittler, der von einem Anbieter bezahlt wird, berät anders als einer, der vom Betrieb bezahlt wird. Das muss kein Nachteil sein, aber es muss auf dem Tisch liegen.

  Die Konditionen von ibis payment stehen unter [Konditionen](/konditionen), für Fragen nutzen Sie [Kontakt](/kontakt).
sections:
  - heading: Was ein PSP ist
    body: |
      Ein Payment Service Provider betreibt eine technische Plattform. Er verbindet das Terminal oder den Online-Shop mit einem oder mehreren Acquirern, bündelt Zahlungsmethoden wie Karten, TWINT und PostFinance, stellt Schnittstellen und Plugins bereit und liefert die Transaktionsdaten an den Betrieb. Im Online-Handel ist der PSP das Gateway, das der Shop anspricht.

      Der PSP ist verantwortlich für die Verfügbarkeit der Plattform, die Korrektheit der Schnittstellen und die Sicherheit der Datenübertragung. Er ist nicht verantwortlich für die Auszahlung, die beim Acquirer liegt, und nicht für das Terminal vor Ort, es sei denn, er liefert es selbst. Manche Anbieter sind PSP und Acquirer in einem; dann hat der Betrieb einen einzigen Vertrag. Im Angebot, das ibis payment vertreibt, ist Planet/Datatrans der PSP für Online-Zahlungen.
  - heading: Was ein Payment Broker ist
    body: |
      Ein Payment Broker betreibt keine Plattform. Er kennt die Anbieter, ihre Preismodelle und ihre Stärken, analysiert die Situation des Betriebs und vermittelt ihn an einen Acquirer, PSP oder Terminal-Anbieter. Oft begleitet er die Einrichtung, erklärt die Abrechnung und bleibt Ansprechpartner.

      Seine Verantwortung ist die Beratung: Passt das Modell zum Betrieb, stimmen die Konditionen, wie lange läuft der Vertrag. Für den Betrieb der Technik und die Auszahlung ist er nicht verantwortlich; das bleibt bei den vermittelten Anbietern. Ein guter Broker sagt das offen und benennt, wer für was zuständig ist. Die Rollen dahinter stehen unter [Rollen im Payment](/wissen/rollen-im-payment).
  - heading: Was ein Payment Orchestrator ist
    body: |
      Ein Payment Orchestrator sitzt über mehreren PSPs und Acquirern und entscheidet pro Zahlung, über welchen Weg sie läuft, etwa nach Kosten, Erfolgsquote oder Ausfall eines Anbieters. Das Modell stammt aus dem Online-Handel mit hohem Volumen und vielen Ländern, wo ein zweiter Acquirer die Ausfallsicherheit erhöht und pro Kartenart der günstigere Weg gewählt werden kann.

      Für einen Betrieb mit einem Terminal am Verkaufspunkt bringt Orchestrierung nichts, weil das Terminal mit einem Acquirer verbunden ist. Für einen Online-Shop mit Umsatz in mehreren Ländern kann sie sinnvoll sein. Sie kostet eine zusätzliche Schicht mit eigener Gebühr und eigenem Vertrag.
  - heading: Wer wofür zuständig ist und welches Modell zu Ihrem Betrieb passt
    body: |
      Drei Fragen klären die Zuständigkeit. Wer betreibt die Technik? PSP und Orchestrator ja, Broker nein. Wer zahlt aus? Keiner der drei, das tut der Acquirer; nur ein PSP mit eigener Acquiring-Lizenz zahlt selbst aus. Wer berät? Der Broker als Hauptaufgabe, PSP und Orchestrator im Rahmen ihres Vertriebs. Bei einem Fehler der Plattform ist also der PSP zuständig, bei einer fehlenden Gutschrift der Acquirer, bei einer Frage zur Abrechnung oder zum Wechsel der Broker.

      Ein Betrieb mit Terminals am Verkaufspunkt braucht einen Acquirer, ein ep2-zertifiziertes Terminal und jemanden, der beides einrichtet und erklärt. Ein separater PSP ist dafür nicht nötig, die Verbindung ist Teil des Angebots. Die Frage ist hier, wer die Beratung macht und wie transparent die Konditionen sind.

      Ein Online-Shop braucht einen PSP als Gateway; die Wahl hängt von Shop-System, Zahlungsmethoden und Ländern ab. Nur ein Händler mit hohem Online-Volumen in mehreren Ländern prüft Orchestrierung. Für die meisten Schweizer Betriebe reicht ein PSP mit breitem Methodenangebot, bei uns Planet/Datatrans mit über 40 Zahlungsmethoden und 14 Shop-Plugins. Details unter [Online-Zahlungen](/online-zahlungen).
  - heading: Wie ein Vermittler bezahlt wird
    body: |
      Es gibt drei Modelle. Erstens Provision vom Anbieter: Der Broker erhält vom Acquirer oder PSP eine Vergütung, solange der Betrieb Kunde ist. Für den Betrieb kostet die Beratung nichts, der Anbieter kalkuliert die Provision in seine Gebühren ein. Zweitens Honorar vom Betrieb: Der Broker verrechnet seine Beratung direkt, unabhängig vom Anbieter. Drittens Mischformen, etwa ein Honorar für die Analyse und eine Provision bei Vertragsabschluss.

      Keines der Modelle ist unseriös. Entscheidend ist, dass der Vermittler sagt, welches gilt und ob er von allen empfohlenen Anbietern gleich bezahlt wird. ibis payment ist Vertriebspartner der SwiPay AG. Wir vermitteln nicht zwischen mehreren Acquirern, sondern vertreiben ein Angebot. Den Vertrag schliessen Sie mit der SwiPay AG; ibis berät, vermittelt und begleitet Sie bis zur Inbetriebnahme.
  - heading: Fragen, die Sie jedem Anbieter stellen sollten
    body: |
      Bevor Sie einen Vertrag unterschreiben, klären Sie diese Punkte schriftlich:

      - Betreiben Sie die Plattform selbst, oder vermitteln Sie an einen Anbieter? Wer ist der Acquirer, und wer zahlt mir das Geld aus?
      - Mit wem schliesse ich den Vertrag, und wie werden Sie als Vermittler bezahlt?
      - Welche Positionen können auf meiner Abrechnung erscheinen? Gibt es Mindestgebühren, Monatsgebühren, Aufschaltgebühren, Portalgebühren?
      - Wie lange läuft der Vertrag, und wie kündige ich? Was passiert mit dem Terminal bei Kündigung?
      - Wer ist bei einem Ausfall des Terminals zuständig, und was ist für diesen Fall vereinbart?
      - Ist das Terminal ep2-zertifiziert, und bleibt es nach 2027 zugelassen?
      - Welche Sätze gelten für Debit- und Kreditkarten, und wovon hängen sie ab?

      Unsere Antworten erhalten Sie schriftlich mit der Offerte. Laufzeit und Kündigung stehen im Vertrag mit SwiPay; wir zeigen sie Ihnen vor der Unterschrift. Wer eine der Fragen für seine Situation geklärt haben will, meldet sich über [Kontakt](/kontakt).
