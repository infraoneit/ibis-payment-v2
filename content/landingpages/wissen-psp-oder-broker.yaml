faq:
  - frage: Ist ibis payment ein PSP oder ein Broker?
    antwort: |
      Weder noch im engen Sinn. ibis payment ist Vertriebspartner der SwiPay AG. Wir beraten, vermitteln und begleiten Sie bis zur Inbetriebnahme. Den Vertrag schliessen Sie mit der SwiPay AG. Das Angebot umfasst Terminals von PayTec, Acquiring über TeleCash/Fiserv und Online-Zahlungen über Planet/Datatrans.
  - frage: Kostet mich ein Broker Geld?
    antwort: |
      Das hängt vom Modell ab. Bei Provision zahlt der Anbieter, und die Provision ist in dessen Gebühren enthalten. Bei Honorar zahlen Sie direkt. Fragen Sie, welches Modell gilt, und lassen Sie es sich schriftlich bestätigen.
  - frage: Brauche ich für ein Terminal einen PSP?
    antwort: |
      Nein, nicht als separaten Vertrag. Die technische Verbindung zwischen Terminal und Acquirer ist Teil des Angebots. Einen PSP als Gateway brauchen Sie für einen Online-Shop.
  - frage: Was bringt mir Payment Orchestrierung?
    antwort: |
      Für Online-Händler mit hohem Volumen in mehreren Ländern eine zweite Abwicklungsstrecke und die Wahl des günstigeren Wegs pro Zahlung. Für einen Betrieb mit Terminal am Verkaufspunkt bringt sie nichts und kostet eine zusätzliche Schicht.
  - frage: Woran erkenne ich einen transparenten Anbieter?
    antwort: |
      Er sagt, wer der Acquirer ist, mit wem Sie den Vertrag schliessen, wie er bezahlt wird, welche Positionen auf der Abrechnung erscheinen können und wie der Vertrag endet. Schriftlich und vor der Unterschrift.
