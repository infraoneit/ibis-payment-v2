metaTitle: 'Zahlterminal kaufen: wann es sich lohnt | ibis payment'
metaDescription: 'Zahlterminal kaufen: für wen sich der Kauf gegenüber der Miete lohnt, welche Risiken beim Besitzer liegen und welche Fragen Sie an die Offerte stellen.'
kicker: Kaufen
lead: Beim Kauf gehört das Terminal Ihnen. Das lohnt sich, wenn Sie es über Jahre am selben Ort nutzen. Den Kaufpreis nennen wir in der Offerte, neben der Miete für dasselbe Modell.
intro: |
  Ein Terminal zu kaufen lohnt sich für Betriebe, die an einem festen Standort über Jahre dasselbe Terminal nutzen. Sie zahlen einmal statt jeden Monat, danach bleibt die Gebühr pro Zahlung. Den Kaufpreis nennen wir nicht auf der Website. Er steht in Ihrer Offerte, zusammen mit der Miete, damit Sie beide Varianten nebeneinander sehen.

  Wer kauft, sollte zwei Dinge wissen. Was ausserhalb der Garantie kaputtgeht, geht auf eigene Rechnung, und das Risiko der Zulassung ab 2027 liegt beim Besitzer. Beides lässt sich mit der Modellwahl klein halten. Die Höchstsätze für die Gebühren pro Zahlung stehen auf der Seite [Konditionen](/konditionen).
sections:
  - heading: Diese Terminals können Sie kaufen
    body: |
      Wir vermitteln Terminals von PayTec. Welches Modell passt, hängt davon ab, wo bezahlt wird.

      - [PayTec N62](/geraete/paytec-n62), mobil, kompakt, ohne Drucker, Beleg per QR, SMS oder E-Mail.
      - [PayTec V3CT3](/geraete/paytec-v3ct3), stationäres Tischterminal mit Tastatur und Drucker, für Betriebe ohne Kasse.
      - [PayTec N86](/geraete/paytec-n86), mobil mit Drucker, Sturzschutz aus 1.5 Metern.
      - [PayTec N96](/geraete/paytec-n96), mobil mit Drucker, 6.5-Zoll-Display, 18 Tage Standby.
      - [PayTec CT20P](/geraete/paytec-ct20p), stationär, kassenintegriert, mit physischem PIN-Pad.

      Den Kaufpreis je Modell nennen wir in der Offerte, ebenso den Preis für Zubehör wie das Kunden-Pinpad P200 zum V3CT3. Automatenterminals wie der [PayTec UN20](/geraete/paytec-un20) und der [PayTec N62 Vending](/geraete/paytec-n62-vending) werden pro Projekt offeriert, weil Einbau und Anbindung je nach Automat verschieden sind.
  - heading: Was beim Kauf gleich bleibt wie bei der Miete
    body: |
      Mit dem Kauf ändert sich, wem das Terminal gehört. Die Abwicklung der Zahlungen bleibt dieselbe:

      - ibis begleitet Sie von der Beratung bis zur Inbetriebnahme: Kassenanbindung über OPI, ZVT oder KIT, WLAN, Testzahlung.
      - Einweisung für Ihr Team: Trinkgeld, Storno, Tagesabschluss, Beleg.
      - Ein fester Ansprechpartner für alle Themen, vom Terminal bis zur Abrechnung.
      - Gutschrift in Schweizer Franken auf Ihr Geschäftskonto. Die Abrechnung zeigt, über welchen Kanal die Umsätze kamen.

      Die Gebühren pro Zahlung fallen bei Kauf und Miete an. Auf Debitkarten sind es höchstens 0.85 %, auf Kreditkarten höchstens 1.5 %; die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in Ihrer Offerte. Auch ein gekauftes Terminal braucht einen Vertrag für die Abwicklung. Den schliessen Sie mit der SwiPay AG. Laufzeit und Kündigung stehen dort, wir zeigen sie Ihnen vor der Unterschrift.

      Anders als bei der Miete liegt die Verantwortung für das Terminal bei Ihnen. Fragen Sie in der Offerte nach, wie Wartung, Updates und ein Defekt ausserhalb der Garantie geregelt sind.
  - heading: Ab wann sich der Kauf gegenüber der Miete lohnt
    body: |
      Je länger Sie dasselbe Terminal nutzen, desto eher lohnt sich der Kauf. Die Miete läuft weiter, solange das Terminal im Einsatz ist; der Kaufpreis fällt einmal an. Ab welchem Zeitpunkt der Kauf günstiger ist, hängt von den beiden Preisen ab. Sie stehen in der Offerte nebeneinander.

      Der Kauf passt unter drei Bedingungen. Der Standort ist fest und der Ablauf ändert sich nicht; wer später von Tresen auf Service am Tisch umstellt, braucht ein anderes Modell. Der Betrieb läuft stabil; wer gerade gründet oder die Saison nicht überblickt, fährt mit der Miete besser, siehe [Zahlterminal mieten](/zahlterminal-mieten). Und Sie sind bereit, das Risiko für Defekt und Nachrüstung selbst zu tragen.

      Drei Fragen an die Offerte helfen bei der Entscheidung. Was kostet dasselbe Modell in Miete und in Kauf. Welche Leistungen stecken in der Miete, die beim Kauf fehlen. Und wie lange läuft die Garantie, und was deckt sie.

      Die Beispielrechnung auf dieser Seite zeigt die Gebühren pro Zahlung für ein Detailhandelsgeschäft. Sie fallen bei Kauf und Miete an; der Unterschied liegt beim Terminal. Eine Anfrage über [Kontakt](/kontakt) genügt, und Sie erhalten beide Varianten in einer Offerte.
  - heading: Risiko Terminalwechsel 2027
    body: |
      Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung, weil die Kartenorganisationen neue Sicherheitsanforderungen stellen. Wer dann ein Terminal besitzt, das sie nicht erfüllt, ersetzt es auf eigene Kosten.

      Darum gilt beim Kauf: nur aktuelle Modelle. Alle Terminals, die wir vermitteln, erfüllen PCI PTS 6.x und sind ep2-zertifiziert. Ein Terminal mit älterer Zertifizierung sollten Sie heute nicht mehr kaufen, auch nicht gebraucht. Lassen Sie sich beim Kauf schriftlich bestätigen, welchen Standard das Terminal erfüllt.

      Zweiter Punkt: Software-Updates. Auch ein gekauftes Terminal braucht sie, damit es im Netzwerk bleibt. Wie Updates bei Kaufterminals verteilt werden, steht in Ihrer Offerte. Wer sich darum nicht kümmern will, mietet.
  - heading: So läuft der Kauf ab
    body: |
      Sie nennen uns Ihren Betrieb, den Ort, an dem bezahlt wird, und ob eine Kasse angebunden werden soll. Wir empfehlen ein Modell. An Werktagen erhalten Sie innert 24 Stunden eine Antwort. In der Offerte stehen Kaufpreis, Miete zum Vergleich, Zubehör und Gebühren pro Zahlung, jede Position einzeln.

      Den Vertrag für die Abwicklung schliessen Sie mit der SwiPay AG. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Ihr Ansprechpartner von ibis begleitet die Inbetriebnahme, bindet die Kasse an, prüft das WLAN und macht mit Ihnen eine Testzahlung. Haben Sie noch ein altes Terminal, prüfen wir mit Ihnen die Kündigungsfrist beim bisherigen Anbieter und legen den Wechsel auf den Stichtag.

      Die Modelle im Detail finden Sie unter [Geräte](/geraete), den Vergleich mit anderen Anbietern unter [Zahlterminal Vergleich](/zahlterminal-vergleich).
