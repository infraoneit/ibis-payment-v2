faq:
  - frage: Was kostet ein Zahlterminal im Kauf?
    antwort: |
      Den Kaufpreis nennen wir in der Offerte, nicht auf der Website. Er hängt vom Modell ab; Automatenterminals werden pro Projekt offeriert. In der Offerte steht auch die Miete für dasselbe Modell zum Vergleich. Dazu kommen die Gebühren pro Zahlung: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen ebenfalls in der Offerte. Mehr unter [Konditionen](/konditionen).
  - frage: Wie lange ist die Garantie?
    antwort: |
      Dauer und Umfang der Garantie stehen in der Offerte. Fragen Sie auch, was sie nicht deckt, etwa Sturz, Flüssigkeit oder Akkuverschleiss. Was ausserhalb der Garantie anfällt, tragen Sie beim Kauf selbst.
  - frage: Muss ich beim Kauf einen Acquiring-Vertrag abschliessen?
    antwort: |
      Ja. Das Terminal braucht einen Vertrag für die Abwicklung der Zahlungen über das SwiPay-Netzwerk. Diesen Vertrag schliessen Sie mit der SwiPay AG. Laufzeit und Kündigung stehen dort; wir zeigen sie Ihnen vor der Unterschrift. Das gekaufte Terminal bleibt Ihr Eigentum.
  - frage: Ist das gekaufte Terminal ab 2027 noch zugelassen?
    antwort: |
      Alle Modelle, die wir vermitteln, erfüllen PCI PTS 6.x und sind ep2-zertifiziert. Lassen Sie sich den Standard beim Kauf schriftlich bestätigen. Ältere Terminals mit früheren Zertifizierungen sind von der Zulassungsfrage betroffen und sollten nicht mehr gekauft werden.
  - frage: Kann ich ein gekauftes Terminal an eine Kasse anbinden?
    antwort: |
      Ja. CT20P, N96 und V3CT3 unterstützen die Kassenprotokolle OPI, ZVT oder KIT, je nach Modell. Die Anbindung richten wir bei der Inbetriebnahme ein. Welche Kassensysteme wir kennen, steht unter [Kassensysteme](/kassensysteme).
  - frage: Kann ich zuerst mieten und später kaufen?
    antwort: |
      Ob ein gemietetes Terminal übernommen werden kann und zu welchem Preis, klären wir in der Offerte. Fragen Sie danach, wenn Sie diese Möglichkeit offenhalten wollen.
