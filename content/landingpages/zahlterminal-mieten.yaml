kicker: Mieten
lead: Bei der Miete zahlen Sie einen festen Betrag pro Monat, und das Terminal bleibt Sache des Vermieters. Das passt, wenn Sie flexibel bleiben wollen. Den Mietpreis nennen wir in der Offerte.
intro: |
  Ein Zahlterminal zu mieten ist die Variante mit dem kleineren Risiko. Sie binden kein Kapital, und wenn sich Ihr Betrieb verändert, besitzen Sie kein Terminal, das nicht mehr passt. Dafür zahlen Sie, solange Sie das Terminal nutzen.

  Den Mietpreis nennen wir nicht auf der Website. Er steht in Ihrer Offerte, zusammen mit dem Kaufpreis, damit Sie beide Varianten nebeneinander sehen. Die Gebühren pro Zahlung richten sich nach Umsatz und Kartenmix; die Höchstsätze stehen auf der Seite [Konditionen](/konditionen). Wer schon weiss, dass er mieten will, schreibt uns über [Kontakt](/kontakt) und erhält an Werktagen innert 24 Stunden eine Antwort.
sections:
  - heading: Was zur Miete gehören sollte
    body: |
      Eine Miete ist mehr als das Terminal. Der Monatsbetrag lohnt sich, wenn der Service dahinter stimmt. Prüfen Sie in jeder Offerte, auch in unserer, ob diese Punkte geregelt sind:

      - Das Terminal selbst: ep2-zertifiziert, mit TWINT, kontaktlos, Apple Pay und Google Pay. Die Terminals von PayTec, die wir vermitteln, erfüllen das und den Sicherheitsstandard PCI PTS 6.x.
      - Wartung und Software-Updates, auch die Sicherheitsupdates, die die Kartenorganisationen vorschreiben.
      - Der Fall eines Defekts: Wer kümmert sich, wie kommen Sie wieder zu einem funktionierenden Terminal, und was kostet das.
      - Die Inbetriebnahme: Kassenanbindung, WLAN, Testzahlung.
      - Die 4G-Datenverbindung der mobilen Modelle.

      Bei ibis payment haben Sie einen festen Ansprechpartner für alle diese Themen. Bei einer Störung meldet er sich bei Ihnen. Was im Mietpreis enthalten ist, steht Punkt für Punkt in der Offerte.

      Nicht zur Miete gehören die Gebühren pro Zahlung. Auf Debitkarten sind es höchstens 0.85 %, auf Kreditkarten höchstens 1.5 %. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen ebenfalls in der Offerte.
  - heading: Wann sich die Miete lohnt
    body: |
      Die Miete passt zu Betrieben, deren Umsatz schwankt oder deren Zukunft noch offen ist.

      **Saisonbetriebe.** Ein Marktstand, ein Badi-Kiosk oder ein Weihnachtsmarkt braucht das Terminal nur einige Monate im Jahr. Ein gekauftes Terminal liegt den Rest des Jahres im Schrank. Bei der Miete kommt es auf die Bedingungen an: Fragen Sie, wie die Zeit zwischen zwei Saisons geregelt ist.

      **Neugründungen.** Wer gerade startet, weiss noch nicht, wie viel Kartenumsatz kommt und ob ein mobiles oder ein stationäres Terminal besser passt. Mit der Miete legen Sie sich nicht auf ein Terminal fest, das Sie später abschreiben müssten.

      **Zweitgeräte.** Ein zweites Terminal für die Terrasse im Sommer, für eine Messe oder als Reserve brauchen Sie nur zeitweise. Dafür lohnt sich ein Kauf selten.

      **Technikwechsel.** Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung, weil die Kartenorganisationen neue Sicherheitsanforderungen stellen. Wer mietet, besitzt kein Terminal, das er bei der nächsten Anforderung auf eigene Kosten ersetzen muss. Wie Updates und Austausch geregelt sind, steht in der Offerte.

      Die Beispielrechnung auf dieser Seite zeigt einen saisonalen Marktstand mit kleinem Bon. Im Rechner weiter unten setzen Sie Ihre eigenen Zahlen ein.
  - heading: Laufzeit, Kündigung und Rückgabe
    body: |
      Den Vertrag schliessen Sie mit der SwiPay AG; ibis berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Laufzeit und Kündigung stehen in diesem Vertrag. Wir zeigen sie Ihnen vor der Unterschrift und gehen die Punkte mit Ihnen durch.

      Was Sie in jedem Mietvertrag lesen sollten, egal bei welchem Anbieter: Laufzeit, Kündigungsfrist, Verlängerungsklausel, was bei Defekt passiert, ob Updates enthalten sind, wie die Rückgabe abläuft und ob die Terminalmiete getrennt vom Acquiring-Vertrag gekündigt werden kann. Bei Terminalverträgen kommen mehrjährige Laufzeiten mit automatischer Verlängerung vor. Wer das erst beim Wechsel merkt, wartet lange.

      Sind Sie heute in einem laufenden Vertrag, prüfen wir mit Ihnen die Kündigungsfrist und planen den Wechsel auf den Stichtag.
  - heading: Miete oder Kauf
    body: |
      Beim Kauf gehört das Terminal Ihnen. Sie zahlen einmal und tragen danach selbst, was mit dem Terminal passiert: ein Defekt, eine Nachrüstung, ein Modell, das nicht mehr zum Ablauf passt. Bei der Miete zahlen Sie laufend und geben dieses Risiko ab.

      Zwei Fragen entscheiden. Brauchen Sie das Terminal in einigen Jahren noch so wie heute, und wollen Sie das Risiko für Defekt und Nachrüstung selbst tragen. Zweimal Ja spricht für den Kauf. Sonst spricht mehr für die Miete.

      In der Offerte stehen beide Varianten nebeneinander, mit Preis und Leistungen. So sehen Sie, ab welcher Nutzungsdauer sich der Kauf für Sie rechnet. Ob Sie ein Mietterminal später übernehmen können, klären wir ebenfalls in der Offerte. Mehr zum Kauf unter [Zahlterminal kaufen](/zahlterminal-kaufen), die Abwägung im Detail unter [Mieten oder kaufen](/wissen/mieten-oder-kaufen).
  - heading: Diese Terminals können Sie mieten
    body: |
      Welches Modell passt, hängt davon ab, wo bezahlt wird.

      - [PayTec N62](/geraete/paytec-n62), mobil, kompakt, ohne Drucker, Beleg digital.
      - [PayTec V3CT3](/geraete/paytec-v3ct3), stationäres Tischterminal mit Tastatur und Drucker.
      - [PayTec N86](/geraete/paytec-n86), mobil mit Drucker, robust.
      - [PayTec N96](/geraete/paytec-n96), mobil mit Drucker und 6.5-Zoll-Display.
      - [PayTec CT20P](/geraete/paytec-ct20p), stationär, kassenintegriert, mit PIN-Pad.

      Den Mietpreis je Modell nennen wir in der Offerte. Automatenterminals wie der [PayTec UN20](/geraete/paytec-un20) werden pro Projekt offeriert, weil Einbau und Anbindung je nach Automat verschieden sind. Technische Daten zu allen Modellen finden Sie unter [Geräte](/geraete).
