faq:
  - frage: Was kostet die Miete eines Zahlterminals?
    antwort: |
      Den Mietpreis nennen wir in der Offerte, nicht auf der Website. Er hängt vom Modell ab. In der Offerte steht auch, was im Mietpreis enthalten ist, und der Kaufpreis zum Vergleich. Dazu kommen die Gebühren pro Zahlung: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen ebenfalls in der Offerte. Mehr unter [Konditionen](/konditionen).
  - frage: Kann ich das Terminal nur für die Saison mieten?
    antwort: |
      Für Saisonbetriebe ist die Miete oft die passende Variante, weil kein gekauftes Terminal ungenutzt herumliegt. Wie die Monate ohne Betrieb geregelt sind, hängt von Laufzeit und Kündigung ab. Beides steht im Vertrag mit SwiPay; wir zeigen es Ihnen vor der Unterschrift.
  - frage: Was passiert, wenn das gemietete Terminal kaputtgeht?
    antwort: |
      Bei einer Störung meldet sich Ihr Ansprechpartner und kümmert sich um die Lösung. Wie ein Defekt bei der Miete geregelt ist, steht in der Offerte. Als Reserve können Sie das [Handy als Terminal](/handy-als-terminal) einrichten und damit Kartenzahlungen annehmen.
  - frage: Wer richtet das gemietete Terminal ein?
    antwort: |
      ibis begleitet Sie bis zur Inbetriebnahme. Ihr Ansprechpartner richtet das Terminal mit Ihnen ein, bindet die Kasse an, prüft das WLAN und macht eine Testzahlung. Welche Leistungen zur Inbetriebnahme gehören, steht in der Offerte.
  - frage: Kann ich das Modell während der Miete wechseln?
    antwort: |
      Das ist ein Grund, der für die Miete spricht: Ändert sich Ihr Ablauf, etwa von Tresen auf Service am Tisch, sind Sie nicht an ein gekauftes Terminal gebunden. Ob und zu welchen Bedingungen ein Wechsel während der Vertragsdauer möglich ist, steht im Vertrag mit SwiPay. Fragen Sie vor der Unterschrift danach.
  - frage: Ab wann lohnt sich der Kauf statt der Miete?
    antwort: |
      Je länger Sie dasselbe Terminal am selben Ort nutzen, desto eher lohnt sich der Kauf. Dafür sind Reparatur und Nachrüstung beim Kauf Ihre Sache. In der Offerte stehen Miete und Kauf nebeneinander, damit Sie es mit Ihren Zahlen sehen. Mehr unter [Zahlterminal kaufen](/zahlterminal-kaufen).
