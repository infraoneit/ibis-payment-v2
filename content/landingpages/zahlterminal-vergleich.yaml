faq:
  - frage: Gibt es einen Zahlterminal-Anbieter, der für alle Betriebe günstiger ist?
    antwort: |
      Nein, das hängt von Ihrem Durchschnittsbetrag und Kartenmix ab. Bei sehr kleinen Umsätzen kann ein App-Anbieter ohne feste Monatsgebühr vorne liegen, mit steigendem Umsatz meist ein Terminal mit Vertrag. Rechnen Sie es mit Ihren Zahlen nach.
  - frage: Was bedeutet Interchange++ im Vergleich zu einem festen Satz?
    antwort: |
      Bei Interchange++ werden Interchange und Scheme Fee durchgereicht, der Anbieter nennt nur seine eigene Gebühr. Bei einem festen Satz, auch Blended genannt, ist alles in einem Prozentsatz enthalten. Vergleichbar werden beide erst, wenn Sie den Gesamtsatz pro Kartenart kennen.
  - frage: Warum ist der Fixbetrag pro Zahlung so wichtig?
    antwort: |
      Weil er bei kleinen Bons mehr ausmacht als der Prozentsatz. Derselbe Rappenbetrag wiegt auf einen Kaffee um ein Mehrfaches schwerer als auf einen Wocheneinkauf. Ein Café oder eine Bäckerei vergleicht den Fixbetrag zuerst.
  - frage: Darf ich meine heutige Abrechnung zum Vergleich weitergeben?
    antwort: |
      Ja, die Abrechnung gehört Ihnen. Wir nutzen sie nur für die Vergleichsrechnung; wie wir mit Ihren Daten umgehen, steht in der [Datenschutzerklärung](/datenschutz). An Werktagen erhalten Sie innert 24 Stunden eine Antwort.
  - frage: Wie oft sollte ich meine Terminalkonditionen prüfen?
    antwort: |
      Alle zwei Jahre, bei jeder Änderung der Interchange-Sätze und spätestens beim Terminalwechsel 2027. Verträge mit langer Laufzeit prüfen Sie vor dem Verlängerungsdatum, sonst verlängern sie sich je nach Klausel automatisch.
