metaDescription: 'Zahlterminal Vergleich Schweiz: neun Kriterien für Terminal-Anbieter, typische Fallen bei Prozentsätzen und ab-Preisen, Rechnen mit der eigenen Abrechnung.'
kicker: Vergleich
lead: Ein Prozentsatz allein sagt nichts. Wer Zahlterminal-Anbieter vergleicht, braucht neun Kriterien und die eigene Abrechnung.
intro: |
  Der Vergleich von Terminal-Anbietern scheitert selten an fehlenden Angeboten, sondern an fehlender Vergleichbarkeit. Der eine nennt einen Satz für alles, der andere einen pro Kartenart, der dritte keinen Satz, sondern eine Servicegebühr plus Interchange. Dazu kommen Fixbeträge pro Zahlung, Terminalmieten, Mindestgebühren und Laufzeiten, die auf keiner Startseite stehen.

  Diese Seite nennt die neun Kriterien, die über die Kosten entscheiden, erklärt die zwei Preismodelle am Markt und die typischen Fallen. Preise einzelner Anbieter nennen wir hier nicht. Sie ändern sich, und entscheidend ist, was auf Ihrer Abrechnung steht. Die Antwort mit Ihren Zahlen gibt der [Rechner](/konditionen#rechner) oder die [Vergleichsrechnung mit Ihrer Abrechnung](/konditionen#abrechnung).
sections:
  - heading: Die neun Kriterien, die über die Kosten entscheiden
    body: |
      Prüfen Sie jeden Anbieter anhand derselben Liste. Fehlt ein Punkt in der Offerte, fragen Sie nach.

      - **Satz pro Kartenart**: Debit Inland, Kredit Inland, TWINT, Amex, Ausland- und Firmenkarten. Ein Satz für alles verdeckt, welche Kartenart teuer ist.
      - **Fixbetrag pro Zahlung**: Bei kleinen Bons zählt er mehr als der Prozentsatz.
      - **Terminalmiete oder Kaufpreis**, und was darin enthalten ist, vor allem Updates und Ersatz.
      - **Monatsgebühren und Mindestgebühr**: Fällt eine Gebühr an, auch wenn kein Umsatz da ist.
      - **Laufzeit und Kündigungsfrist**: Wie lange sind Sie gebunden, und verlängert sich der Vertrag automatisch.
      - **Support**: Wer antwortet, wie schnell, und ob jemand vor Ort kommt.
      - **TWINT**: auf dem Terminal oder nur per Aufsteller mit separater Abrechnung.
      - **Kassenanbindung**: OPI, ZVT oder KIT, und ob die Anbindung etwas kostet.
      - **Störung und Defekt**: Wie kommen Sie wieder zu einem funktionierenden Terminal, und was kostet das.

      Zwei Angaben liefert nicht der Anbieter, sondern Sie: Ihr Durchschnittsbetrag pro Zahlung und Ihr Kartenmix. Ohne diese beiden Zahlen ist kein Vergleich belastbar. Rechnen Sie am Ende den effektiven Satz über alle Karten: alle Gebühren eines Monats geteilt durch den Kartenumsatz. Nur diese Zahl lässt sich zwischen zwei Angeboten vergleichen.
  - heading: Zwei Preismodelle, drei Kostenanteile
    body: |
      Jede Kartenzahlung besteht aus drei Kostenanteilen. Die Interchange geht an die Bank, die die Karte herausgegeben hat; sie ist in der Schweiz reguliert. Die Scheme Fee geht an die Kartenorganisation, also Visa oder Mastercard. Die Acquiring-Gebühr deckt Abwicklung und Service. Vor allem im dritten Anteil unterscheiden sich die Anbieter. Die geltenden Interchange-Sätze mit Quelle stehen im Artikel [Kartenzahlung Gebühren Schweiz](/wissen/kartenzahlung-gebuehren-schweiz).

      Daraus ergeben sich zwei Preismodelle. Beim Modell **Blended** nennt der Anbieter einen Satz pro Kartenart, in dem alle drei Anteile stecken. Beim Modell **Interchange++** werden Interchange und Scheme Fee durchgereicht, und der Anbieter nennt nur seine eigene Gebühr. Beides ist legitim. Schwierig wird es, wenn der eine seine Gebühr nennt, der andere den Gesamtsatz, und beide Zahlen nebeneinander gelegt werden.

      Für die Terminals, die ibis payment vermittelt, gelten Höchstsätze: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte. Die Zerlegung weiter unten zeigt die drei Anteile im Überblick.
  - heading: Typische Fallen beim Vergleich
    body: |
      **Prozent ohne Kontext.** Ein tiefer Satz nützt wenig, wenn ein Fixbetrag pro Zahlung dazukommt. Bei einem kleinen Bon machen wenige Rappen schnell mehr aus als der Prozentsatz. Vergleichen Sie die effektive Gebühr auf Ihren Monatsumsatz, nicht den Satz.

      **ab-Preise.** Ein Satz mit «ab» gilt meist für die Kartenart mit dem tiefsten Satz beim höchsten Umsatz. Fragen Sie nach dem Satz für jede Kartenart bei Ihrem Umsatz. Umgekehrt sagt ein Höchstsatz nur, was Sie höchstens zahlen. Massgebend ist in beiden Fällen die Offerte.

      **Auslandzuschläge.** Karten aus dem Ausland und Firmenkarten kosten in der Regel mehr. Entscheidend ist, wie viel mehr und ob der Zuschlag in der Offerte steht. Ein Betrieb mit Touristen oder Geschäftskunden liest diesen Anteil aus der heutigen Abrechnung und fragt gezielt danach.

      **Mindestgebühren und Laufzeiten.** Eine Mindestgebühr macht einen tiefen Satz in umsatzschwachen Monaten zunichte. Eine Laufzeit von mehreren Jahren mit automatischer Verlängerung nimmt Ihnen die Möglichkeit, bei besseren Angeboten zu wechseln. Lesen Sie beides im Vertrag nach, bevor Sie unterschreiben.

      **Terminalmiete separat.** Manche Verträge trennen Acquiring und Terminalmiete mit unterschiedlichen Laufzeiten. Wer das Acquiring kündigt, zahlt die Terminalmiete weiter.
  - heading: Vier Anbietertypen
    body: |
      **Grossanbieter.** Betreiben eigene Acquiring-Plattformen und Terminalflotten. Die Preise stehen teils in einer Liste, teils werden sie individuell offeriert, zum Beispiel als Servicegebühr plus Interchange. Vergleichbar wird das erst mit dem Gesamtsatz pro Kartenart.

      **App-Anbieter.** Kleine Leser, die mit dem Handy gekoppelt werden, oft ohne feste Monatsgebühr und mit einem Satz pro Zahlung. Bei sehr kleinen Umsätzen kann das die günstigste Variante sein; mit steigendem Umsatz zählt der Satz pro Zahlung stärker. Prüfen Sie, ob TWINT auf dem Gerät läuft und ob es ep2-zertifiziert ist.

      **Banken.** Vermitteln Terminals und Acquiring als Teil der Geschäftsbeziehung. Vorteil: ein Ansprechpartner für Konto und Karten. Preise sind selten öffentlich.

      **Vermittler und Payment Broker.** Betreiben keine eigene Plattform, sondern ordnen den Betrieb einem passenden Netzwerk zu und übernehmen die Beratung. ibis payment gehört zu diesem Typ: Vertriebspartner der SwiPay AG, Terminals von PayTec, Acquiring über TeleCash/Fiserv. Den Vertrag schliessen Sie mit der SwiPay AG; ibis berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Für Sie heisst das: ein fester Ansprechpartner für alle Themen.
  - heading: So vergleichen Sie mit Ihren Zahlen
    body: |
      Der Rechner weiter unten braucht drei Angaben: Branche, Kartenumsatz pro Jahr und Durchschnittsbon. Kennen Sie Ihre heutige Kondition, tragen Sie sie ein; sonst rechnet er mit dem Branchendurchschnitt. Das Ergebnis ist eine Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite zeigt eine Praxis mit hohem Bon.

      Genauer als jeder Rechner ist die echte Abrechnung. Schicken Sie uns Ihre letzte Monatsabrechnung über [Abrechnung einreichen](/konditionen#abrechnung). An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit einer persönlichen Vergleichsrechnung auf Basis derselben Umsätze. Liegt das Angebot nicht unter Ihrer heutigen Abrechnung, sagen wir Ihnen das.

      Viele Betriebe prüfen ihre Terminalkonditionen erst, wenn ein Problem da ist. Dabei ändern sich die Rahmenbedingungen, zuletzt mit den tieferen Interchange-Sätzen für Debitkarten. Ein Vergleich alle zwei Jahre, spätestens beim Terminalwechsel 2027, lohnt sich auch ohne Problem.
