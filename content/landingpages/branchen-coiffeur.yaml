faq:
  - frage: Brauche ich im Salon ein Terminal mit Drucker?
    antwort: |
      In den meisten Fällen nicht. Der N62 zeigt den Beleg als QR-Code auf dem Display oder schickt ihn per SMS oder E-Mail. Wer trotzdem Papier will, nimmt den V3CT3 mit eingebautem Drucker.
  - frage: Kann die Kundin Trinkgeld über die Karte geben?
    antwort: |
      Ja. Das Terminal fragt vor der Bestätigung nach einem Trinkgeld, die Kundin wählt einen Betrag oder überspringt die Abfrage. Das Trinkgeld wird mit dem Umsatz gutgeschrieben und mit demselben Satz belastet wie der Grundbetrag.
  - frage: Was passiert, wenn das WLAN im Salon ausfällt?
    antwort: |
      Der N62 wechselt automatisch auf 4G und zahlt weiter. Der V3CT3 am Empfang hängt am LAN oder WLAN; wo die Verbindung unsicher ist, empfehlen wir das Kabel. Bei einer Störung am Terminal wenden Sie sich an Ihren festen Ansprechpartner.
  - frage: Lohnt sich ein Terminal für einen Salon mit wenigen Kartenzahlungen?
    antwort: |
      Das hängt von Umsatz und Kartenmix ab. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten; dazu kommt das Terminal als Miete oder Kauf, der Preis steht in der Offerte. Schicken Sie uns Ihre Zahlen, dann sehen Sie vor der Unterschrift, was es bei Ihrem Umsatz kostet.
  - frage: Kann ich TWINT am Terminal annehmen?
    antwort: |
      Ja, TWINT läuft direkt auf dem Terminal, ohne separaten QR-Aufsteller. Der Satz für TWINT steht in der Offerte. Wie der Preis insgesamt zustande kommt, lesen Sie unter [Konditionen](/konditionen).
  - frage: Wie lange dauert der Wechsel vom bisherigen Anbieter?
    antwort: |
      Die Vergleichsrechnung zu Ihrer Abrechnung erhalten Sie innert 24 Stunden an Werktagen. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Den Zeitpunkt des Wechsels bestimmt die Kündigungsfrist Ihres heutigen Vertrags.
