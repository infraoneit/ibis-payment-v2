metaDescription: 'Zahlterminal für den Coiffeursalon: Trinkgeld auf dem Terminal, Beleg per QR-Code, Anbindung an die Terminsoftware. Genaue Sätze in der Offerte.'
kicker: Branche
lead: Ein Terminal, das in die Schürze passt, Trinkgeld annimmt und ohne Papierrolle auskommt. Die Gebühren stehen vor der Unterschrift fest.
intro: |
  Im Coiffeursalon wird am Ende des Termins bezahlt, am Empfang oder direkt am Stuhl. Die Kundschaft zahlt mit dem, was gerade in der Hand ist: Debitkarte, Kreditkarte, TWINT oder Handy. Wer nur Bargeld annimmt, schickt sie zum Bancomat.

  Für einen Salon zählen drei Dinge. Das Terminal darf nicht im Weg stehen. Trinkgeld muss ohne Münzen funktionieren. Und die Gebühren müssen zum Umsatz des Salons passen, auch in einer ruhigen Woche. Dazu kommt die Frage, ob Ihre Terminsoftware den Betrag ans Terminal übergeben kann.

  Wie der Preis zustande kommt, steht unter [Konditionen](/konditionen). Eine Offerte mit Ihren Zahlen erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: So läuft die Zahlung im Salon ab
    body: |
      Der Termin ist fertig, die Kundin kommt zum Empfang. Sie tippen den Betrag ins Terminal oder übernehmen ihn aus der Terminsoftware und drehen das Display zur Kundin. Sie hält Karte oder Handy hin, bestätigt bei Bedarf ein Trinkgeld und gibt bei höheren Beträgen die PIN ein.

      Den Beleg braucht im Salon kaum jemand auf Papier. Der [PayTec N62](/geraete/paytec-n62) zeigt einen QR-Code auf dem Display, die Kundin scannt ihn und hat den Beleg auf dem Handy. Alternativ geht er per SMS oder E-Mail raus. Papierrolle, Nachschub und Rollenwechsel zwischen zwei Terminen entfallen.

      TWINT läuft direkt auf dem Terminal, ohne QR-Aufsteller am Tresen. Apple Pay und Google Pay werden wie die hinterlegte Karte abgerechnet.
  - heading: N62 am Stuhl oder V3CT3 am Empfang
    body: |
      Für die meisten Salons passt der [PayTec N62](/geraete/paytec-n62). Er wiegt 176 Gramm, hat keinen Drucker, verbindet sich über WLAN oder 4G und schafft laut Datenblatt über 550 Zahlungen pro Akkuladung. Er liegt in der Schublade am Empfang oder steckt in der Schürzentasche.

      Wer einen fixen Empfang hat und einen gedruckten Beleg will, nimmt den [PayTec V3CT3](/geraete/paytec-v3ct3): ein Tischterminal mit Tastatur und eigenem Drucker, per LAN oder WLAN verbunden.

      Faustregel: ein Stuhl oder mobiler Service, dann N62. Fester Empfang mit Papierbeleg, dann V3CT3. Salons mit mehreren Stühlen und Stosszeiten am Samstag kombinieren beides, ein Terminal am Empfang und ein mobiles als zweite Linie. Beide Terminals gibt es als Miete oder Kauf, der Preis steht in der Offerte. Alle Modelle stehen unter [Geräte](/geraete).
  - heading: Trinkgeld ohne Münzen
    body: |
      Immer weniger Kundschaft hat Bargeld dabei. Das Terminal fragt vor der Bestätigung nach einem Trinkgeld, die Kundin wählt einen Betrag oder überspringt die Frage. Ob die Abfrage aktiv ist, legen wir bei der Inbetriebnahme mit Ihnen fest.

      Das Trinkgeld läuft als Teil der Kartenzahlung mit, wird mit dem Umsatz gutgeschrieben und unterliegt derselben Gebühr wie der Grundbetrag. Damit Sie es am Monatsende dem Team zuordnen können, brauchen Sie die Liste der einzelnen Zahlungen aus dem Händlerportal. Wie Sie es verteilen und verbuchen, klären Sie mit Ihrem Treuhänder.
  - heading: Terminsoftware anbinden oder Betrag eintippen
    body: |
      Viele Salons führen Termine und Preise in einer Software, die auch als Kasse dient. Unterstützt sie eines der Kassenprotokolle OPI, ZVT oder KIT, übergibt sie den Betrag direkt ans Terminal. Niemand tippt ab, und der Tagesabschluss stimmt mit der Kartenabrechnung überein. Der N62 wird über KIT in der Cloud angebunden, der V3CT3 über KIT oder ZVT-LAN.

      Ob Ihre Software das kann, klären wir vor der Inbetriebnahme mit dem Softwareanbieter. Wenn nicht, bleibt das Eintippen, was bei zwanzig Zahlungen am Tag kein Problem ist. Wer gleichzeitig über ein neues Kassensystem nachdenkt, findet unter [Kassensysteme](/kassensysteme) die Systeme, die sich anbinden lassen.
  - heading: Samstag, Akku und Ausfall
    body: |
      Am Samstag sind mehrere Kundinnen gleichzeitig fertig. Ein zweites Terminal verkürzt die Wartezeit am Empfang; was es kostet, steht in der Offerte. Der Akku des N62 hält laut Datenblatt über 14 Stunden Bildschirmzeit; über Nacht ist er in 2.5 Stunden geladen.

      Fällt das WLAN aus, wechselt der N62 selbständig auf 4G. Bei einer Störung am Terminal wenden Sie sich an Ihren festen Ansprechpartner. Er ist für alle Themen zuständig, vom Terminal bis zur Abrechnung. Details unter [Support](/support).
  - heading: Kosten, Abrechnung und Wechsel
    body: |
      Was ein Salon zahlt, hängt von Umsatz und Kartenmix ab. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze stehen in der Offerte, ebenso der Satz für TWINT und der Preis für das Terminal als Miete oder Kauf. Der [Rechner](/konditionen#rechner) schätzt mit Ihren Werten die mögliche Ersparnis als Spanne pro Monat und Jahr; die Beispielrechnung auf dieser Seite rechnet mit den dort genannten Annahmen.

      Die Kartenumsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt. Die Abrechnung zeigt, über welchen Kanal die Umsätze kamen.

      Wenn Sie heute schon ein Terminal haben, schicken Sie uns Ihre letzte Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Beim Wechsel richtet sich der Termin nach der Kündigungsfrist Ihres heutigen Vertrags.
