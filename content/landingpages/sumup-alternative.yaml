faq:
  - frage: Ab welchem Umsatz lohnt sich der Wechsel von SumUp?
    antwort: |
      Das hängt von Kartenmix und Durchschnittsbetrag ab. Setzen Sie Ihre Zahlen in den Rechner ein, oder schicken Sie uns die Umsatzübersicht aus Ihrem SumUp-Konto. An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit Vergleichsrechnung. Wir sagen Ihnen auch, wenn es sich noch nicht lohnt.
  - frage: Geht TWINT bei SumUp auf dem Terminal?
    antwort: |
      Das fragen Sie am besten direkt bei SumUp, weil sich das Angebot ändern kann. Wichtig ist der Unterschied dahinter: Läuft TWINT auf dem Gerät, mit Betrag vom Terminal und auf derselben Abrechnung, oder über einen QR-Aufsteller mit separatem Konto. Auf den Terminals, die ibis payment vermittelt, ist TWINT integriert.
  - frage: Muss ich bei ibis payment eine Laufzeit eingehen?
    antwort: |
      Den Vertrag schliessen Sie mit der SwiPay AG; ibis berät, vermittelt und begleitet. Laufzeit und Kündigung stehen in diesem Vertrag. Wir zeigen sie Ihnen vor der Unterschrift, zusammen mit allen Gebühren.
  - frage: Kann ich meinen SumUp-Leser weiter nutzen?
    antwort: |
      Als Reserve ja, solange Ihr SumUp-Konto besteht. Für den Alltag ersetzt ihn das Terminal von PayTec, weil TWINT, PostFinance Card und die Kassenanbindung dort laufen. Zwei parallele Systeme bedeuten zwei Abrechnungen.
  - frage: Was ist der Unterschied zwischen einem SumUp-Leser und einem ep2-Terminal?
    antwort: |
      ep2 ist der Schweizer Standard für Zahlterminals. Er ermöglicht PostFinance Card, Reka, Lunch-Check, TWINT am Terminal und die Anbindung an Schweizer Kassensysteme über OPI, ZVT und KIT. Ob ein bestimmter Leser ep2-zertifiziert ist, steht in den technischen Angaben des Herstellers. Die Terminals von PayTec, die wir vermitteln, sind es alle.
  - frage: Brauche ich für das Terminal ein Kassensystem?
    antwort: |
      Nein. Die mobilen Terminals und der V3CT3 laufen eigenständig, der Betrag wird am Terminal eingetippt. Bei den Modellen mit Kassenprotokoll lässt sich eine Kasse auch später anbinden.
