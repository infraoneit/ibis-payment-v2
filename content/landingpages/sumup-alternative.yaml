metaDescription: 'SumUp Alternative Schweiz: wann sich ein Terminal mit Vertrag statt eines Kartenlesers lohnt, TWINT auf dem Terminal, Kassenanbindung, fester Ansprechpartner.'
kicker: Wechsel
lead: Ein kleiner Kartenleser mit Abrechnung pro Zahlung ist für den Start oft die richtige Wahl. Mit wachsendem Kartenumsatz lohnt sich der Vergleich mit einem Terminal mit Vertrag, bei dem TWINT, Kassenanbindung und ep2 dazugehören.
intro: |
  SumUp ist bekannt für kleine, mobile Kartenleser. Wer einmal im Monat an einem Markt steht oder gerade gegründet hat, fährt mit einem solchen Leser oft gut. Die aktuellen Preise und Bedingungen stehen auf der Website des Anbieters. Wir nennen sie hier nicht, weil sie sich ändern können.

  Mit dem Umsatz ändert sich die Rechnung. Ein Modell, das vor allem pro Zahlung kostet, ist bei kleinen Umsätzen günstig; bei grösseren zählt jeder Zehntelprozentpunkt. Ein Terminal mit Vertrag hat in der Regel feste Kosten für das Terminal, dafür andere Sätze pro Kartenart. Dazwischen liegt der Punkt, an dem sich der Wechsel lohnt. Wo er für Ihren Betrieb liegt, zeigt der [Rechner](/konditionen#rechner) oder die [Vergleichsrechnung mit Ihren Umsätzen](/konditionen#abrechnung). Die Höchstsätze von ibis payment stehen auf der Seite [Konditionen](/konditionen).
sections:
  - heading: Für wen ein Kartenleser wie SumUp passt
    body: |
      Ein mobiler Kartenleser passt zu Betrieben mit sehr kleinem oder unregelmässigem Kartenumsatz: ein Verein mit Festwirtschaft an zwei Wochenenden im Jahr, ein Nebenerwerb, ein Stand an einem einzelnen Markt. Wer nur gelegentlich Karten annimmt, will keine festen Kosten. Dafür ist ein Modell mit Abrechnung pro Zahlung gemacht, und bei solchen Umsätzen ist das in Ordnung.

      Drei Fragen sollten Sie Ihrem Anbieter stellen, bevor der Betrieb wächst. Läuft TWINT direkt auf dem Gerät, oder braucht es dafür einen QR-Aufsteller mit separater Abrechnung. Ist das Gerät ep2-zertifiziert und nimmt es PostFinance Card, Reka und Lunch-Check an. Und lässt es sich an Ihre Kasse anbinden. Für einen Marktstand spielt das selten eine Rolle, für eine Bäckerei mit Stammkundschaft schon.
  - heading: Ab wann ein Terminal mit Vertrag günstiger wird
    body: |
      Die Rechnung hat zwei Seiten. Auf der einen stehen die festen Kosten eines Terminals mit Vertrag, vor allem Miete oder Kaufpreis. Den Preis für beide Varianten nennen wir in der Offerte. Auf der anderen steht die Differenz bei den Gebühren pro Zahlung. Bei ibis payment sind es höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten; die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte.

      Je höher der Kartenumsatz, desto stärker wirkt die Differenz bei den Sätzen, und desto eher sind die festen Kosten ausgeglichen. Wo der Punkt liegt, hängt von Kartenmix und Durchschnittsbetrag ab; bei vielen kleinen Zahlungen fällt ein Fixbetrag pro Zahlung stärker ins Gewicht als bei wenigen grossen.

      Die Beispielrechnung auf dieser Seite zeigt einen Coiffeursalon. Im Rechner weiter unten setzen Sie Ihre Zahlen ein: Branche, Kartenumsatz pro Jahr und Durchschnittsbon. Wissen Sie, was Sie heute pro Monat an Gebühren zahlen, tragen Sie auch das ein; die Summe finden Sie in der Übersicht Ihres SumUp-Kontos.

      Laufzeit und Kündigung stehen im Vertrag mit SwiPay. Wir zeigen sie Ihnen vor der Unterschrift, damit Sie beide Seiten kennen, bevor Sie wechseln.
  - heading: TWINT auf dem Terminal
    body: |
      Bei einem Aufsteller mit statischem QR-Code tippt der Kunde den Betrag selbst ein, Sie kontrollieren auf seinem Handy, und die Zahlung landet in einem separaten TWINT-Konto mit eigener Abrechnung.

      Auf den Terminals von PayTec, die wir vermitteln, ist TWINT integriert. Das Terminal zeigt den QR-Code mit dem Betrag, der Kunde scannt, die Bestätigung erscheint bei Ihnen. Die TWINT-Zahlungen stehen auf derselben Abrechnung wie die Karten. Den Satz für TWINT nennen wir in der Offerte. Mehr dazu auf der Seite [TWINT Terminal](/twint-terminal).

      Läuft TWINT bei Ihnen heute über einen Aufsteller, fehlt dieser Umsatz in der Übersicht Ihres Kartenlesers. Rechnen Sie ihn beim Vergleich mit.
  - heading: Kassenanbindung, Support und ep2
    body: |
      **Kassenanbindung.** Wer eine Kasse hat, will den Betrag nicht zweimal eintippen. Die Terminals [PayTec CT20P](/geraete/paytec-ct20p), [PayTec N96](/geraete/paytec-n96) und [PayTec V3CT3](/geraete/paytec-v3ct3) sprechen die Kassenprotokolle OPI, ZVT oder KIT. Die Kasse übergibt den Betrag, das Terminal meldet die Zahlung zurück. Die Anbindung richten wir bei der Inbetriebnahme ein. Welche Kassensysteme wir kennen, steht unter [Kassensysteme](/kassensysteme).

      **Support.** Sie haben einen festen Ansprechpartner für alle Themen, vom Terminal bis zur Abrechnung. Bei einer Störung meldet er sich bei Ihnen. Wie Sie uns erreichen, steht unter [Support](/support).

      **ep2.** Der Schweizer Standard für Terminals. Er ist Voraussetzung für PostFinance Card, Reka und Lunch-Check und für die Anbindung an Schweizer Kassensysteme. Alle Terminals, die wir vermitteln, sind ep2-zertifiziert und erfüllen den Sicherheitsstandard PCI PTS 6.x. Das zählt mit Blick auf 2027, wenn viele ältere Terminals voraussichtlich die Zulassung verlieren.
  - heading: So wechseln Sie von SumUp
    body: |
      Der Wechsel beginnt mit Ihren Zahlen. Prüfen Sie in Ihrem SumUp-Konto, ob ein Abo oder eine Laufzeit besteht. Den Leser können Sie als Reserve behalten.

      - Schicken Sie uns die Umsatzübersicht der letzten Monate über [Abrechnung einreichen](/konditionen#abrechnung). An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit einer persönlichen Vergleichsrechnung.
      - Liegt das Angebot nicht unter Ihren heutigen Kosten, sagen wir Ihnen das. Dann bleiben Sie bei Ihrem Leser, bis der Umsatz gewachsen ist.
      - Lohnt sich der Wechsel, wählen Sie das Modell und Miete oder Kauf; beide Preise stehen in der Offerte. Für Betriebe, die von einem kompakten Leser kommen, ist der [PayTec N62](/geraete/paytec-n62) oft der nächste Schritt: ebenfalls kompakt, ohne Drucker, Beleg per QR, SMS oder E-Mail, dazu TWINT, 4G und ep2.
      - Den Vertrag schliessen Sie mit der SwiPay AG. ibis begleitet Sie bis zur Inbetriebnahme: Kasse anbinden, Testzahlung, Einweisung. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen.

      Die Gutschrift erfolgt in Schweizer Franken auf Ihr Geschäftskonto. Die Abrechnung zeigt, über welchen Kanal die Umsätze kamen.
