intro: |
  In Zürich ist die Auswahl an Terminalanbietern gross, und der Vergleich ist schwer, weil sich die Angebote in Gebühren, Terminals und Vertragsbedingungen unterscheiden. ibis payment vermittelt Terminals des Herstellers PayTec aus Effretikon, mit Abwicklung über das SwiPay-Bezahlnetzwerk. Wie der Preis zustande kommt, steht auf der Seite [Konditionen](/konditionen) und gilt in Zürich wie überall.

  ibis payment ist in der ganzen Schweiz tätig und begleitet Betriebe von der ersten Beratung bis zur Inbetriebnahme. Den Vertrag schliessen Sie mit der SwiPay AG. Diese Seite zeigt, wie der Ablauf aussieht, welche Terminals zu welchen Betrieben passen und wovon der Preis abhängt.
sections:
  - heading: Beratung und Inbetriebnahme für Betriebe in Zürich
    body: |
      Der erste Schritt ist ein Gespräch, am Telefon oder nach Absprache im Betrieb. Es geht um den Zahlort: Tresen, Tisch, Kasse, Stand, Automat. Daraus ergibt sich das Modell. Dann schicken Sie uns Ihre letzte Abrechnung oder drei Zahlen, und Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.

      Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Zur Inbetriebnahme gehören das Einrichten des Terminals, die Anbindung der Kasse über OPI, ZVT oder KIT, die Prüfung von WLAN und 4G-Empfang am Zahlort und eine Testzahlung.

      Für Winterthur und die Ostschweiz gibt es eigene Seiten: [Zahlterminal Winterthur](/zahlterminal-winterthur) und [Zahlterminal Ostschweiz](/zahlterminal-ostschweiz). Den Termin für das erste Gespräch vereinbaren Sie über [Kontakt](/kontakt).
  - heading: Typische Betriebe in Zürich
    body: |
      **Bars und Restaurants.** Hohe Frequenz, Service am Tisch, Terrasse, Trinkgeld, oft bis spät in die Nacht. Hier braucht es ein mobiles Terminal, das eine lange Schicht durchhält und bei WLAN-Lücken auf 4G wechselt. Der [PayTec N96](/geraete/paytec-n96) mit Drucker und 18 Tagen Standby oder der kompakte [PayTec N62](/geraete/paytec-n62) ohne Drucker sind dafür gebaut.

      **Detailhandel.** Läden mit Kassensystem binden den [PayTec CT20P](/geraete/paytec-ct20p) an. Der Betrag kommt von der Kasse, das physische PIN-Pad ist auch für Menschen mit Sehbehinderung bedienbar. Bei internationaler Kundschaft fällt der Anteil ausländischer Karten ins Gewicht; welche Sätze dafür gelten, steht in der Offerte.

      **Praxen und Dienstleister.** Wenige Zahlungen mit hohem Betrag, hoher Kreditkartenanteil. Ein stationäres Terminal am Empfang oder der [PayTec V3CT3](/geraete/paytec-v3ct3) mit Drucker für Praxen ohne Kassensystem.

      **Events und Märkte.** Food-Stände, Festivals, Weihnachtsmärkte und Pop-ups brauchen ein Terminal für einige Wochen. Ob Miete, Kauf oder das Handy als Terminal passt, hängt von der Dauer ab; Laufzeit und Kündigung stehen im Vertrag mit SwiPay. Mehr unter [Zahlterminal mieten](/zahlterminal-mieten).
  - heading: Was es kostet
    body: |
      In Zürich gelten dieselben Konditionen wie in der ganzen Schweiz. Was ein Betrieb zahlt, hängt von Umsatz und Kartenmix ab. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten; die genauen Sätze stehen in der Offerte, zusammen mit allen weiteren Positionen.

      Das Terminal gibt es als Miete oder Kauf, der Preis steht ebenfalls in der Offerte. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Die Kartenumsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt; die Abrechnung zeigt, über welchen Kanal sie kamen.

      Der [Rechner](/konditionen#rechner) schätzt in 60 Sekunden die mögliche Ersparnis als Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite rechnet mit den Annahmen für eine Bar mit vielen Zahlungen und mittlerem Bon. Haben Sie heute schon ein Terminal, schicken Sie uns die Abrechnung. Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.
  - heading: TWINT und Kassenanbindung
    body: |
      Auf den Terminals von PayTec ist TWINT integriert. Der Betrag kommt vom Terminal oder von der Kasse, der QR-Code erscheint auf dem Display, die Zahlung landet auf derselben Abrechnung wie die Karten. Der QR-Aufsteller mit separatem Händlerkonto wird überflüssig. Details auf der Seite [TWINT Terminal](/twint-terminal).

      Die Kassenanbindung läuft über die Schweizer Protokolle OPI, ZVT und KIT. Welches Protokoll Ihre Kasse spricht, klären wir vor der Inbetriebnahme. Wer gleichzeitig eine neue Kasse sucht, findet die Übersicht unter [Kassensysteme](/kassensysteme). Für Netzwerk und WLAN arbeiten wir mit InfraOne IT Solutions in Winterthur zusammen.
  - heading: Wechsel vom bisherigen Anbieter
    body: |
      Der Wechsel läuft in drei Schritten: Abrechnung schicken, Vergleichsrechnung innert 24 Stunden an Werktagen erhalten, Vertrag mit der SwiPay AG abschliessen. Was beim Wechsel zu beachten ist, steht auf den Seiten [Worldline Alternative](/worldline-alternative) und [SumUp Alternative](/sumup-alternative).

      Zwei Hinweise. Prüfen Sie die Kündigungsfrist Ihres heutigen Vertrags, bevor Sie den Wechsel planen; Verträge mit mehrjähriger Laufzeit und automatischer Verlängerung sind verbreitet. Und: Ältere Terminals verlieren mit der Zeit ihre Zulassung. Wer ohnehin wechseln muss, kann bei dieser Gelegenheit auch die Gebühren neu vergleichen.
