faq:
  - frage: Berät ibis payment auch Betriebe in Zürich?
    antwort: |
      Ja. ibis payment berät Betriebe in der ganzen Schweiz, auch in Stadt und Kanton Zürich. Das Gespräch findet am Telefon oder nach Absprache im Betrieb statt. Sie haben einen festen Ansprechpartner, von der Beratung bis zur Inbetriebnahme.
  - frage: Sind die Konditionen in Zürich anders als im Rest der Schweiz?
    antwort: |
      Nein. Überall gelten dieselben Höchstsätze: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab, nicht vom Standort, und stehen in der Offerte. Mehr unter [Konditionen](/konditionen).
  - frage: Welches Terminal passt für eine Bar mit Terrasse?
    antwort: |
      Ein mobiles Terminal mit WLAN und 4G, das automatisch wechselt, wenn eines ausfällt. Der N96 hat einen Drucker und einen Akku für lange Nächte, der N62 ist kompakt und schickt den Beleg digital. Bei beiden wird das Trinkgeld am Terminal eingegeben.
  - frage: Was ist mit ausländischen Karten von Touristen?
    antwort: |
      Welche Sätze für ausländische Karten und Firmenkarten gelten, steht in der Offerte. Wer viele Touristen bedient, liest den Anteil aus der heutigen Abrechnung und gibt ihn bei der Anfrage an, damit die Vergleichsrechnung ihn berücksichtigt.
  - frage: Was passiert bei einem Defekt am Terminal?
    antwort: |
      Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner. Was im Störungsfall gilt, steht im Vertrag mit SwiPay. Als Überbrückung kommt das Handy als Terminal in Frage, siehe [Handy als Terminal](/handy-als-terminal).
  - frage: Kann ich das Terminal nur für ein Event mieten?
    antwort: |
      Das klären wir in der Offerte. Terminals gibt es als Miete oder Kauf; Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Für einzelne Events kommt auch das Handy als Terminal in Frage, siehe [Handy als Terminal](/handy-als-terminal).
