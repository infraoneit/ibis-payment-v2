faq:
  - frage: Funktioniert das Terminal mit meiner bestehenden Kasse?
    antwort: |
      Wenn die Kasse OPI, ZVT oder KIT unterstützt, ja. Das klären wir vor der Inbetriebnahme mit Ihrem Kassenanbieter. ibis payment begleitet die Anbindung bis zur ersten Zahlung.
  - frage: Was kostet eine Zahlung mit kleinem Betrag?
    antwort: |
      Die Gebühr richtet sich nach der Karte: höchstens 0.85 % auf Debitkarten, höchstens 1.5 % auf Kreditkarten. Die genauen Sätze und alle weiteren Positionen stehen in der Offerte. Bei vielen kleinen Beträgen lohnt es sich, mit dem eigenen Durchschnittsbon zu rechnen; der [Rechner](/konditionen#rechner) hilft dabei.
  - frage: Brauche ich für den Self-Checkout ein spezielles Terminal?
    antwort: |
      Ein kassenintegriertes Terminal mit physischem PIN-Pad und fester Montage, wie der CT20P. Der Betrag kommt von der Kasse, der Kunde bedient das PIN-Pad selbst, das Kensington-Schloss sichert das Terminal.
  - frage: Kann ich für die Weihnachtszeit ein zusätzliches Terminal nehmen?
    antwort: |
      Ein zusätzlicher CT20P oder ein mobiler N62 lässt sich einrichten. Ob Sie das Terminal nach der Saison zurückgeben können, hängt von Laufzeit und Kündigung ab. Beides steht im Vertrag mit SwiPay, wir zeigen es Ihnen vor der Unterschrift.
  - frage: Wie stimmt die Gutschrift mit dem Kassenabschluss überein?
    antwort: |
      Die Umsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt, und die Abrechnung zeigt, über welchen Kanal sie kamen. In welchem Rhythmus ausbezahlt wird, steht im Vertrag mit SwiPay. Mit Kassenanbindung kennen Kasse und Terminal dieselben Beträge, das erleichtert den Abgleich.
