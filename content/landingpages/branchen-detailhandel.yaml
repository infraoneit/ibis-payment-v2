metaTitle: Zahlterminal für den Detailhandel | ibis payment
metaDescription: 'Kartenterminal für den Laden: kassenintegriert mit PIN-Pad, mobil für die Beratung am Regal, Self-Checkout. Genaue Sätze je nach Umsatz in der Offerte.'
kicker: Branche
lead: Das Terminal an der Kasse übernimmt den Betrag, der Kunde zahlt am PIN-Pad, der Abschluss stimmt. Für Laden, Boutique und Self-Checkout.
intro: |
  Im Detailhandel läuft die Kartenzahlung an der Kasse. Artikel scannen, der Betrag erscheint auf dem Terminal, der Kunde hält die Karte hin oder gibt die PIN ein, der Beleg kommt aus dem Kassendrucker. Jede Sekunde zählt, besonders am Samstag und im Dezember, und jeder abgetippte Betrag ist ein Fehler, der am Abend beim Kassenabschluss auftaucht.

  Im Laden sind viele Beträge klein. Bei einer Zeitung oder einem Getränk lohnt sich ein genauer Blick darauf, wie die Gebühr pro Zahlung berechnet wird. Und wer am Regal berät, will die Zahlung dort abschliessen, wo der Kunde steht.

  Wie der Preis zustande kommt, steht unter [Konditionen](/konditionen), die Offerte erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: Betrag aus der Kasse, nicht aus dem Kopf
    body: |
      Mit Kassenanbindung übergibt die Kasse den Betrag ans Terminal, sobald der Verkauf abgeschlossen wird. Die Kassiererin tippt nichts ab, der Kunde sieht den Betrag auf dem Terminal, zahlt, und die Kasse bucht die Zahlung als Kartenzahlung. Beim Kassenabschluss stimmen Kasse und Terminal überein, weil beide dieselben Beträge kennen.

      In der Schweiz laufen diese Anbindungen über die Protokolle OPI, ZVT oder KIT. Ob Ihre Kasse eines davon spricht, klären wir vor der Inbetriebnahme mit dem Kassenanbieter. ibis payment begleitet die Anbindung, bis die erste Zahlung durch die Kasse läuft. Wer die Kasse ersetzen will, findet unter [Kassensysteme](/kassensysteme) die Systeme, die wir anbieten und anbinden.
  - heading: CT20P an der Kasse, V3CT3 ohne Kasse, N62 am Regal
    body: |
      An der Kasse steht der [PayTec CT20P](/geraete/paytec-ct20p). Er ist kassenintegriert, hat ein physisches PIN-Pad mit 15 Tasten und fühlbaren Markierungen, hängt am LAN oder WLAN, auf Wunsch mit Strom über das Netzwerkkabel, und druckt über den Kassendrucker. Ein Kensington-Schloss sichert ihn am Tresen.

      Für Läden ohne Kassensystem, etwa Bäckerei, Blumenladen oder Kiosk, passt der [PayTec V3CT3](/geraete/paytec-v3ct3). Betrag eintippen, Karte vorhalten, Beleg abreissen. Mit dem Kunden-Pinpad P200 zahlt der Kunde auf seiner Seite des Tresens, ohne dass das Terminal über die Theke wandert.

      Für die Beratung am Regal, in der Boutique oder im Möbelgeschäft kommt der mobile [PayTec N62](/geraete/paytec-n62) dazu. Er wiegt 176 Gramm, läuft über WLAN oder 4G, der Beleg geht per QR-Code oder E-Mail raus, und über KIT lässt er sich an die Kasse anbinden. Alle Terminals gibt es als Miete oder Kauf, der Preis steht in der Offerte. Alle Modelle unter [Geräte](/geraete).
  - heading: Kleinbeträge und was sie für die Gebühr heissen
    body: |
      Bei einem Getränk oder einer Zeitung wiegt jede Gebühr, die pro Zahlung anfällt, schwerer als bei einem Wocheneinkauf. Wer viele kleine Beträge hat, vergleicht deshalb nicht nur Prozentsätze, sondern rechnet mit dem eigenen Durchschnittsbon.

      Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte, zusammen mit allen weiteren Positionen. Wo die Debitkarte den grössten Teil des Umsatzes ausmacht, prägt der Debitsatz die Abrechnung.

      Der [Rechner](/konditionen#rechner) schätzt mit Ihrem Umsatz und Ihrem Durchschnittsbon die mögliche Ersparnis als Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite rechnet mit den dort genannten Annahmen für einen Laden.
  - heading: Samstag, Mittag, Dezember
    body: |
      In Stosszeiten entscheidet die Zahl der Kassen, nicht die Geschwindigkeit eines einzelnen Terminals. Eine zweite Kasse mit eigenem CT20P verkürzt die Schlange. Ob sich ein zusätzliches Terminal nur für die Dezemberwochen dazunehmen lässt, hängt von Laufzeit und Kündigung ab; beides steht im Vertrag mit SwiPay. Ein N62 als mobile Zusatzlinie fängt die Schlange ab, wenn eine Kasse ausfällt oder die Beratung im Laden gleich mit kassieren soll.

      Der CT20P hängt am Kabel, nicht am WLAN. In Ladenlokalen mit Betonwänden und vielen Handys im Raum ist das die zuverlässige Variante. Mit Strom über das Netzwerkkabel entfällt das Netzteil am Tresen. Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner, siehe [Support](/support).
  - heading: Self-Checkout und die Kundenseite
    body: |
      Beim Self-Checkout bedient der Kunde Kasse und Terminal allein. Dafür braucht es ein Terminal mit physischem PIN-Pad, das fest montiert ist und den Betrag direkt von der Kasse bekommt. Der CT20P erfüllt das: PIN-Pad mit fühlbaren Markierungen, das auch Menschen mit Sehbehinderung bedienen können, Kensington-Schloss gegen Diebstahl, Beleg über den Kassendrucker.

      Die fühlbaren Markierungen sind mehr als Komfort. Barrierefreies Bezahlen wird im Detailhandel zunehmend verlangt, und ein reiner Touchscreen ist für Menschen mit Sehbehinderung schwer bedienbar. Wer heute eine Kasse plant, sollte das Terminal gleich mit einplanen.
  - heading: Kassenabschluss, Abrechnung und Wechsel
    body: |
      Die Kartenumsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt. Die Abrechnung zeigt, über welchen Kanal die Umsätze kamen. Mit Kassenanbindung kennen Kasse und Terminal dieselben Beträge, was den Abgleich mit dem Kassenabschluss erleichtert.

      Wenn Sie heute schon ein Terminal haben, schicken Sie uns Ihre letzte Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme, auch bei der Kassenanbindung. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Die Höchstsätze und den Rechner finden Sie unter [Konditionen](/konditionen).
