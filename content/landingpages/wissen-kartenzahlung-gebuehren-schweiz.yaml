metaDescription: 'Kartenzahlung Gebühren Schweiz: Interchange-Obergrenzen der WEKO, Scheme Fee, Acquiring-Gebühr, weitere Positionen und der effektive Satz Ihrer Abrechnung.'
kicker: Wissen
lead: Jede Kartengebühr besteht aus drei Teilen, und nur einer davon unterscheidet die Anbieter. Wer das weiss, liest seine Abrechnung anders.
intro: |
  Die Gebühr für eine Kartenzahlung wird meist als ein Prozentsatz genannt. Dahinter stecken drei Empfänger: die Bank, die die Karte ausgegeben hat, das Kartennetzwerk und der Anbieter, der die Zahlung für den Betrieb abwickelt. Für den ersten Anteil gelten in der Schweiz amtliche Obergrenzen, den zweiten legen die Netzwerke fest. Der dritte ist die Acquiring-Gebühr, und nur sie unterscheidet sich von Anbieter zu Anbieter.

  Je nach Anbieter kommen Positionen dazu, die in keinem Prozentsatz stecken: ein Fixbetrag pro Zahlung, Zuschläge für ausländische Karten, Mindestgebühren, Monatsgebühren, die Kosten für das Terminal. Ob ein Angebot günstig ist, zeigt sich erst, wenn man alle Positionen auf den eigenen Umsatz und den eigenen Kartenmix anwendet.

  Bei ibis payment zahlen Sie höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte. Mehr dazu unter [Konditionen](/konditionen), Fragen beantworten wir über [Kontakt](/kontakt).
sections:
  - heading: Drei Anteile in jeder Kartengebühr
    body: |
      Der erste Anteil ist die Interchange-Gebühr. Sie geht an die kartenausgebende Bank, den Issuer, als Entschädigung dafür, dass die Bank die Karte ausgibt, das Konto führt und das Risiko des Kartenmissbrauchs trägt. In der Schweiz legt die Wettbewerbskommission WEKO die Obergrenzen für Inlandkarten fest.

      Der zweite Anteil ist die Scheme Fee, auch Netzwerkgebühr genannt. Sie geht an Visa oder Mastercard für den Betrieb des Netzwerks, über das die Zahlung autorisiert und abgerechnet wird. Die Höhe setzen die Netzwerke fest.

      Der dritte Anteil ist die Acquiring-Gebühr. Sie deckt die Abwicklung der Zahlung, die Auszahlung an den Betrieb und den Service. Nur dieser Anteil unterscheidet sich zwischen Anbietern. Wer zwei Angebote vergleicht, vergleicht deshalb im Kern die Acquiring-Gebühr und die Positionen, die neben dem Prozentsatz stehen.
  - heading: 'Interchange in der Schweiz: die amtlichen Obergrenzen der WEKO'
    body: |
      Die folgenden Sätze sind amtliche Obergrenzen für den Interchange-Anteil bei Zahlungen mit Schweizer Karten im Inland. Dieser Anteil geht an die kartenausgebende Bank. Es sind keine Preise von ibis payment.

      - **Debit Mastercard, am Verkaufspunkt:** 0.12 %, mit einem Deckel von 30 Rappen ab Beträgen von 300 Franken. Für Online- und Mobile-Zahlungen galten 0.31 % bis zum 31. Oktober 2025, seither gelten 0.28 %. Quelle: [WEKO, Medienmitteilung vom 16. Mai 2024](https://www.admin.ch/de/nsb?id=101037).
      - **Visa Debit, am Verkaufspunkt:** im Durchschnitt höchstens 0.15 %. Je nach Händlerkategorie gilt ein Basissatz von höchstens 0.20 % oder, für Güter des täglichen Bedarfs, von höchstens 0.12 %. Für Online-Zahlungen mit Debitkarten gelten seit dem 1. November 2025 0.25 %. Quelle: WEKO, Verfügung vom 18. Juli 2025 und [Medienmitteilung vom 24. Juli 2025](https://www.weko.admin.ch/de/newnsb/TN62E0Z5SBWkDtlngfknQ).
      - **Kreditkarten von Visa und Mastercard:** durchschnittlich 0.44 %. Quelle: [WEKO, Medienmitteilung vom 15. Dezember 2014](https://www.admin.ch/de/nsb?id=55663).

      Diese Obergrenzen erklären, warum Debitkarten für den Betrieb günstiger sind als Kreditkarten: Der Interchange-Anteil liegt bei Kreditkarten deutlich höher. Sie zeigen auch, wo die Untergrenze einer Gebühr liegt. Ein Satz unter dem Interchange deckt schon den ersten der drei Anteile nicht.
  - heading: 'Blended oder Interchange++: zwei Arten, dieselben Kosten zu zeigen'
    body: |
      Beim Modell Blended nennt der Anbieter einen Satz pro Kartenart, in dem alle drei Anteile enthalten sind. Der Betrieb weiss vorher, was eine Zahlung kostet. Er sieht aber nicht, wie sich der Satz auf die drei Anteile verteilt, es sei denn, der Anbieter weist es aus.

      Beim Modell Interchange++ werden Interchange und Scheme Fee zum effektiven Satz durchgereicht und die Acquiring-Gebühr separat verrechnet. Das ist transparent, aber die Abrechnung wird lang: Jede Kartenart und jede Händlerkategorie hat einen eigenen Interchange-Satz, und Änderungen der Netzwerke schlagen direkt durch. Für Betriebe mit sehr hohem Kartenumsatz kann sich das lohnen. Für einen kleinen Betrieb wird die Abrechnung damit schwer vergleichbar.

      Bei ibis payment gilt ein Satz pro Kartenart: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte.
  - heading: Ein Fixbetrag pro Zahlung wiegt bei kleinen Beträgen schwer
    body: |
      Neben dem Prozentsatz verrechnen manche Anbieter einen Fixbetrag pro Transaktion. Er sieht klein aus, fällt aber bei kleinen Beträgen stärker ins Gewicht als der Prozentsatz. Derselbe Rappenbetrag ist bei einem Kaffee ein spürbarer Teil der Zahlung, bei einem grossen Einkauf fällt er kaum auf.

      Der Fixbetrag ist auch der Grund, warum sich zwei Angebote mit gleichem Prozentsatz stark unterscheiden können. Andere Anbieter verzichten auf den Fixbetrag und verlangen dafür einen höheren Satz. Welches Modell günstiger ist, hängt vom Durchschnittsbetrag ab. Ob für Ihren Betrieb ein Fixbetrag gilt und wie hoch er ist, steht in der Offerte.

      Die Beispielrechnung auf dieser Seite arbeitet mit Annahmen für ein Café mit kleinem Durchschnittsbetrag. Setzen Sie im Rechner Ihren eigenen Durchschnittsbetrag ein; er ergibt sich aus Umsatz geteilt durch Anzahl Zahlungen auf Ihrer Abrechnung.
  - heading: Auslandkarten, American Express, TWINT und weitere Positionen
    body: |
      Für Karten ausländischer Banken und für Firmenkarten gelten andere, meist höhere Interchange-Sätze. Die Obergrenzen der WEKO betreffen nur Inlandkarten. Viele Anbieter verrechnen für diese Karten deshalb einen Zuschlag. Wer Touristen bedient oder viele Geschäftskunden hat, sieht diese Position auf jeder Abrechnung. Was für Ihren Betrieb gilt, steht in der Offerte.

      American Express ist ein eigenes Netzwerk mit eigener Preisstruktur. TWINT läuft ausserhalb der Kartennetzwerke und hat eine eigene Gebühr. Die Sätze für beide stehen ebenfalls in der Offerte. Apple Pay, Google Pay und Samsung Pay sind keine eigenen Kartenarten, sondern Hüllen um eine hinterlegte Karte; massgebend ist der Satz dieser Karte.

      Drei weitere Positionen stehen nicht im Prozentsatz. Eine Mindestgebühr pro Monat fällt an, wenn der Umsatz unter einer Schwelle liegt, und trifft Saisonbetriebe. Eine Monats- oder Servicegebühr fällt unabhängig vom Umsatz an. Eine Aufschaltgebühr fällt einmal am Anfang an und zählt im ersten Jahr mit. Fragen Sie bei jedem Angebot nach diesen drei Positionen und nach den Kosten für das Terminal. Bei ibis payment stehen alle Positionen in der Offerte; versteckte Kosten gibt es nicht.
  - heading: So lesen Sie Ihre eigene Abrechnung
    body: |
      Der aussagekräftigste Wert ist der effektive Satz: alle Gebühren eines Monats geteilt durch den Kartenumsatz desselben Monats. Er fasst Prozentsätze, Fixbeträge, Zuschläge, Monatsgebühren und Terminalkosten in einer Zahl zusammen und lässt sich mit jedem Angebot vergleichen.

      So gehen Sie vor:

      - Notieren Sie aus der letzten Monatsabrechnung den Kartenumsatz, die Anzahl Zahlungen und die Summe aller Gebühren inklusive Terminalkosten.
      - Teilen Sie den Umsatz durch die Anzahl Zahlungen. Das ist Ihr Durchschnittsbetrag.
      - Lesen Sie ab, welcher Anteil des Umsatzes mit Kredit- und welcher mit Debitkarten bezahlt wurde. Das ist Ihr Kartenmix.
      - Teilen Sie die Summe aller Gebühren durch den Umsatz. Das ist Ihr effektiver Satz.

      Mit Umsatz, Durchschnittsbetrag und Ihren heutigen Kosten haben Sie die Angaben für den Rechner auf dieser Seite. Wer das nicht selbst rechnen will, schickt uns die Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine persönliche Vergleichsrechnung. Ist unser Angebot nicht günstiger als Ihre heutige Abrechnung, sagen wir Ihnen das. Die Rollen hinter den drei Anteilen stehen unter [Rollen im Payment](/wissen/rollen-im-payment).
