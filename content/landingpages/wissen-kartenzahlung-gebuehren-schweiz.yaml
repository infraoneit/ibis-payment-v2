faq:
  - frage: Warum sind Debitkarten für den Betrieb günstiger als Kreditkarten?
    antwort: |
      Weil der Interchange-Anteil tiefer ist. Die amtliche Obergrenze der WEKO liegt für Debit Mastercard am Verkaufspunkt bei 0.12 %, für Kreditkarten bei durchschnittlich 0.44 %, jeweils für Inlandzahlungen (WEKO, Medienmitteilungen vom 16. Mai 2024 und vom 15. Dezember 2014). Dieser Anteil geht an die kartenausgebende Bank und ist kein Preis von ibis payment.
  - frage: Was kostet eine Kartenzahlung bei ibis payment?
    antwort: |
      Höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte. Dort stehen auch die Sätze für weitere Zahlungsarten und alle übrigen Positionen.
  - frage: Ist Interchange++ günstiger als ein fester Satz?
    antwort: |
      Nicht automatisch. Interchange++ zeigt die drei Anteile getrennt, verrechnet aber dieselben Kosten. Ob es günstiger ist, hängt von der Acquiring-Gebühr des Anbieters ab und von Ihrem Kartenmix. Vergleichen Sie beide Modelle über den effektiven Satz.
  - frage: Was ist der effektive Satz?
    antwort: |
      Alle Gebühren eines Monats inklusive Fixbeträge, Zuschläge und Terminalkosten, geteilt durch den Kartenumsatz desselben Monats. Mit dieser Zahl lassen sich zwei Angebote mit unterschiedlicher Struktur vergleichen.
  - frage: Warum kostet eine Zahlung mit Apple Pay dasselbe wie mit der Karte?
    antwort: |
      Apple Pay, Google Pay und Samsung Pay sind keine eigenen Kartenarten. Hinter der Wallet liegt eine Debit- oder Kreditkarte, und diese Karte bestimmt Interchange und Satz.
  - frage: Gibt es Gebühren, die nicht in der Offerte stehen?
    antwort: |
      Nein. Die Gebührenstruktur ist transparent, versteckte Kosten gibt es nicht. Jede Position, die verrechnet wird, steht in der Offerte. Prüfen Sie bei jedem Angebot, ob Mindestgebühren, Portalgebühren, Beleggebühren oder Aufschaltgebühren aufgeführt sind.
  - frage: Wie oft sollte ich die Gebühren prüfen?
    antwort: |
      Einmal im Jahr, mit einer vollständigen Monatsabrechnung. Die Interchange-Obergrenzen für Debitkarten hat die WEKO zuletzt 2024 und 2025 neu geregelt, und ein Angebot, das vor Jahren fair war, muss es heute nicht mehr sein.
