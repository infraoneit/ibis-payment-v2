intro: |
  Mit dem Kauf eines Terminals ist es nicht getan. Es muss eingerichtet, an die Kasse angebunden, ins WLAN gebracht und dem Team erklärt werden. ibis payment begleitet Betriebe in der ganzen Schweiz von der ersten Beratung bis zur Inbetriebnahme, in Winterthur genauso wie anderswo.

  ibis payment vermittelt Terminals des Herstellers PayTec aus Effretikon, mit Abwicklung über das SwiPay-Bezahlnetzwerk. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet. Wie der Preis zustande kommt, steht auf der Seite [Konditionen](/konditionen) und gilt schweizweit gleich.
sections:
  - heading: Beratung und Inbetriebnahme für Betriebe in Winterthur
    body: |
      Der Ablauf beginnt mit einem Gespräch, am Telefon oder nach Absprache im Betrieb. Wir wollen wissen, wo bezahlt wird: Tresen, Tisch, Kasse, Stand. Daraus ergibt sich das Modell. Dann schicken Sie uns Ihre letzte Abrechnung oder drei Zahlen, und Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.

      Den Vertrag schliessen Sie mit der SwiPay AG. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Zur Inbetriebnahme gehören das Einrichten des Terminals, die Anbindung der Kasse über OPI, ZVT oder KIT, die Prüfung der Verbindung am Zahlort und eine Testzahlung.

      Danach bleibt Ihr Ansprechpartner derselbe, für alle Themen vom Terminal bis zur Abrechnung. Bei einer Störung wenden Sie sich an ihn. Den Termin für ein erstes Gespräch vereinbaren Sie über [Kontakt](/kontakt).
  - heading: Typische Betriebe in Winterthur
    body: |
      **Gastronomie.** Restaurants, Bars und Cafés mit Service am Tisch und Aussenbereich brauchen ein mobiles Terminal mit zuverlässiger Verbindung. Der [PayTec N96](/geraete/paytec-n96) mit Drucker oder der kompakte [PayTec N62](/geraete/paytec-n62) ohne Drucker laufen über WLAN und 4G und wechseln automatisch, wenn eines ausfällt. Trinkgeld wird am Terminal eingegeben, der Beleg gedruckt oder digital verschickt.

      **Detailhandel.** Läden mit Kassensystem binden den [PayTec CT20P](/geraete/paytec-ct20p) an die Kasse an. Der Betrag kommt von der Kasse, das physische PIN-Pad ist auch für Menschen mit Sehbehinderung bedienbar. Bäckereien, Metzgereien und Take-aways ohne Kasse nehmen den [PayTec V3CT3](/geraete/paytec-v3ct3) mit Tastatur und Drucker, auf Wunsch mit Kunden-Pinpad für die Theke.

      **Praxen.** Arzt-, Zahnarzt- und Physiopraxen haben wenige Zahlungen mit hohem Betrag und oft einen hohen Kreditkartenanteil. Hier prägt der Kreditsatz die Abrechnung. Ein stationäres Terminal am Empfang deckt den Fall ab; ob sich die Praxissoftware anbinden lässt, klären wir vorab.

      Dazu kommen Coiffeure, Kosmetikstudios, Werkstätten, Märkte und Vereine. Welche Bauform passt, zeigt die Übersicht unter [Zahlterminal](/zahlterminal).
  - heading: Was es kostet
    body: |
      Der Preis hängt nicht vom Standort ab, sondern von Umsatz und Kartenmix. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze stehen in der Offerte, zusammen mit allen weiteren Positionen.

      Das Terminal gibt es als Miete oder Kauf, der Preis steht ebenfalls in der Offerte. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Die Kartenumsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt; die Abrechnung zeigt, über welchen Kanal sie kamen.

      Der [Rechner](/konditionen#rechner) schätzt in 60 Sekunden die mögliche Ersparnis als Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite rechnet mit den Annahmen für eine Bäckerei mit vielen kleinen Zahlungen und tiefem Kreditkartenanteil. Haben Sie heute schon ein Terminal, schicken Sie uns die Abrechnung. Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.
  - heading: Netzwerk und WLAN am Zahlort
    body: |
      Ein Terminal ist nur so zuverlässig wie seine Verbindung. Ein stationäres Terminal braucht LAN oder stabiles WLAN am Kassenplatz, ein mobiles Terminal WLAN auf der Terrasse oder guten 4G-Empfang. Fehlt das, liegt das Problem nicht beim Terminal, sondern beim Netzwerk.

      Die mobilen Terminals von PayTec wechseln automatisch zwischen WLAN und 4G. Ob die Verbindung am Zahlort reicht, klären wir vor der Inbetriebnahme, damit das Terminal nicht mit einer wackligen Verbindung in Betrieb geht. Für Netzwerk und WLAN arbeiten wir mit InfraOne IT Solutions in Winterthur zusammen. Mehr dazu unter [Support](/support).
  - heading: Wechsel vom bisherigen Anbieter
    body: |
      Haben Sie Ihren Terminalvertrag seit Jahren beim selben Anbieter, oft über die Hausbank, läuft der Wechsel in drei Schritten: Abrechnung schicken, Vergleichsrechnung innert 24 Stunden an Werktagen erhalten, Vertrag mit der SwiPay AG abschliessen. Prüfen Sie vorher die Kündigungsfrist Ihres heutigen Vertrags; der Termin für die Umstellung richtet sich danach.

      Wer ein älteres Terminal hat, sollte den Wechsel nicht zu lange aufschieben, denn ältere Modelle verlieren mit der Zeit ihre Zulassung. Ob Ihr Terminal betroffen ist, klären wir anhand von Modell und Baujahr. Worauf Sie beim Vergleich achten müssen, steht auf der Seite [Zahlterminal Vergleich](/zahlterminal-vergleich).
