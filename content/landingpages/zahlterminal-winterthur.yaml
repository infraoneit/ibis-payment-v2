faq:
  - frage: Berät ibis payment auch Betriebe in Winterthur?
    antwort: |
      Ja. ibis payment berät Betriebe in der ganzen Schweiz, auch in Winterthur. Das Gespräch findet am Telefon oder nach Absprache im Betrieb statt. Sie haben einen festen Ansprechpartner, von der Beratung bis zur Inbetriebnahme.
  - frage: Ist ibis payment nur in Winterthur tätig?
    antwort: |
      Nein. ibis payment ist Vertriebspartner für Payment- und Kassensysteme in der ganzen Schweiz. Für Betriebe in Winterthur gelten derselbe Ablauf und dieselben Konditionen wie überall.
  - frage: Sind die Konditionen in Winterthur anders als im Rest der Schweiz?
    antwort: |
      Nein. Überall gelten dieselben Höchstsätze: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab, nicht vom Standort, und stehen in der Offerte. Mehr unter [Konditionen](/konditionen).
  - frage: Was passiert, wenn das WLAN im Betrieb nicht reicht?
    antwort: |
      Die mobilen Terminals weichen automatisch auf 4G aus. Stationäre Terminals brauchen LAN oder stabiles WLAN am Kassenplatz. Ob die Verbindung reicht, klären wir vor der Inbetriebnahme, nicht danach.
  - frage: Was passiert bei einem Defekt am Terminal?
    antwort: |
      Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner. Was im Störungsfall gilt, steht im Vertrag mit SwiPay; wir zeigen es Ihnen vor der Unterschrift.
