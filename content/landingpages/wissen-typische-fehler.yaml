faq:
  - frage: Wie oft sollte ich die Konditionen prüfen?
    antwort: |
      Einmal im Jahr mit einer vollständigen Monatsabrechnung, und zusätzlich, wenn sich etwas ändert: neue Kasse, zweiter Standort, deutlich mehr Kartenumsatz oder neue Interchange-Obergrenzen der WEKO.
  - frage: Was ist der wichtigste Wert auf der Abrechnung?
    antwort: |
      Der effektive Satz, also alle Gebühren eines Monats geteilt durch den Kartenumsatz. Er enthält Prozentsätze, Fixbeträge, Zuschläge und Terminalkosten und lässt sich mit jedem Angebot vergleichen.
  - frage: Woran erkenne ich, ob mein Terminal nach 2027 noch zugelassen ist?
    antwort: |
      Fragen Sie Ihren Anbieter schriftlich. Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung wegen neuer Sicherheitsanforderungen der Kartenorganisationen. Die PayTec-Terminals bei ibis payment sind nach PCI PTS 6.x zertifiziert.
  - frage: Lohnt sich der Wechsel, wenn mein Vertrag noch läuft?
    antwort: |
      Das hängt von Restlaufzeit und Differenz ab. Wir rechnen Ihnen vor, ob die Ersparnis die Restlaufzeit aufwiegt, und sagen es Ihnen, wenn sich das Warten bis zum Vertragsende mehr lohnt.
  - frage: Wie läuft die Prüfung durch ibis payment ab?
    antwort: |
      Sie schicken die letzte Monatsabrechnung. Sie erhalten innert 24 Stunden an Werktagen eine persönliche Vergleichsrechnung. Liegt unser Angebot nicht unter Ihrer heutigen Abrechnung, sagen wir Ihnen das.
