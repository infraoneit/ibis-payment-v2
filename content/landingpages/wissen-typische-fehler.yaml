title: Fünf Fehler beim Zahlterminal, die Betriebe Geld kosten
pfad: /wissen/typische-fehler
cluster: wissen
navTitle: Typische Fehler
metaTitle: 'Zahlterminal: 5 Fehler vermeiden | ibis payment'
metaDescription: 'Fünf häufige Fehler bei Zahlterminal und Kartenzahlung, je mit Beispiel und Gegenmassnahme, dazu eine Checkliste für die jährliche Prüfung der Abrechnung.'
kicker: Wissen
lead: Die teuren Fehler bei der Kartenzahlung passieren nicht bei der Auswahl des Terminals, sondern in den Jahren danach, wenn niemand mehr hinschaut.
intro: |
  Ein Zahlterminal wird einmal ausgewählt und dann vergessen. Es funktioniert, die Gutschrift kommt, die Abrechnung landet beim Treuhänder. Das ist der Normalfall, und genau darin liegt das Problem. Rahmenbedingungen ändern sich, der Betrieb wächst, die WEKO legt neue Obergrenzen für die Interchange-Gebühr fest, und die Konditionen von damals bleiben.

  Die Fehler wiederholen sich. Es sind keine Fehler der Technik, sondern der Gewohnheit: Entscheidungen werden nicht mehr geprüft, Setups nur ergänzt, Prozentsätze ohne Kontext verglichen, Erwartungen an die falsche Stelle gerichtet, und hingeschaut wird erst, wenn etwas nicht mehr geht.

  Womit Sie vergleichen können, steht unter [Konditionen](/konditionen), Hilfe beim Vergleich gibt es über [Kontakt](/kontakt).
sections:
  - heading: 'Fehler 1: Die Entscheidung von damals nicht mehr prüfen'
    body: |
      Ein Restaurant hat vor Jahren ein Terminal mit einem Vertrag abgeschlossen, der damals in Ordnung war. Seither hat die Wettbewerbskommission mit Mastercard und Visa neue Obergrenzen für die Interchange-Gebühr auf Debitkarten vereinbart, der Anteil der Kartenzahlungen am Umsatz ist gestiegen, und der Betrieb hat eine Terrasse dazubekommen. Die Konditionen sind dieselben wie am ersten Tag, und niemand hat gefragt, ob sie noch passen. Die Obergrenzen stehen unter [Kartenzahlung Gebühren Schweiz](/wissen/kartenzahlung-gebuehren-schweiz).

      Die Gegenmassnahme ist ein fixer Termin: einmal im Jahr eine Monatsabrechnung nehmen und den effektiven Satz ausrechnen, alle Gebühren geteilt durch den Umsatz. Wer den Wert von Jahr zu Jahr notiert, sieht, ob sich etwas bewegt. Wer dazu Laufzeit und Kündigungsfrist seines Vertrags kennt, weiss auch, bis wann er handeln müsste.
  - heading: 'Fehler 2: Das gewachsene Setup nur ergänzen'
    body: |
      Ein Laden hat eine Kasse von einem Anbieter, ein Terminal von einem zweiten und einen Online-Shop mit Gateway von einem dritten. Jedes Teil kam dazu, als es gebraucht wurde. Heute gibt es drei Abrechnungen, drei Hotlines, drei Verträge mit unterschiedlichen Laufzeiten, und die Kartenzahlung an der Kasse wird abgetippt, weil die beiden Anbieter nie miteinander gesprochen haben.

      Die Gegenmassnahme: Bei jeder Erweiterung das Ganze anschauen, nicht nur das neue Teil. Was muss mit was sprechen, welche Verträge laufen wann aus, wer ist bei welchem Fehler zuständig. Oft zeigt sich, dass ein Anbieter, der Terminal, Kassenanbindung und Online-Zahlung zusammen liefert, zwei andere Verträge überflüssig macht. Die Protokolle, die Kasse und Terminal verbinden, heissen in der Schweiz OPI, ZVT und KIT; welche Ihre Kasse spricht, steht in deren Dokumentation.
  - heading: 'Fehler 3: Prozentsätze ohne Kontext vergleichen'
    body: |
      Ein Café bekommt zwei Offerten. Die eine nennt einen etwas höheren Prozentsatz ohne Fixbetrag, die andere einen tieferen Prozentsatz plus einen Fixbetrag pro Zahlung. Das Café verkauft vor allem Kaffee und Gipfeli, der Durchschnittsbetrag ist klein. Bei kleinen Beträgen wiegt der Fixbetrag mehr als der Unterschied im Prozentsatz, und die erste Offerte ist günstiger. Bei einem Betrieb mit grossen Durchschnittsbeträgen fällt der Fixbetrag kaum ins Gewicht, und die Rechnung dreht.

      Der Prozentsatz allein sagt nichts. Vergleichbar wird er erst zusammen mit dem Durchschnittsbetrag, dem Kartenmix, den Fixbeträgen pro Zahlung, den Mindest- und Monatsgebühren und den Kosten für das Terminal. Die Gegenmassnahme ist, beide Offerten auf dieselbe Monatsabrechnung anzuwenden und den Gesamtbetrag zu vergleichen. Der Rechner auf dieser Seite schätzt den Unterschied mit Ihren Angaben; wie Sie die Werte aus der Abrechnung lesen, steht unter [Kartenzahlung Gebühren Schweiz](/wissen/kartenzahlung-gebuehren-schweiz).
  - heading: 'Fehler 4: Erwartungen an die falsche Stelle richten'
    body: |
      Eine Praxis stellt am Montag fest, dass die Gutschrift vom Freitag fehlt. Die Praxisassistentin ruft die Nummer auf dem Terminal an, landet beim Terminal-Hersteller, der nichts über Gutschriften weiss, und wird an den Acquirer verwiesen, dessen Nummer niemand kennt. Am Ende lag es an einem Feiertag, und die Gutschrift kam mit Verzögerung.

      Die Gegenmassnahme ist, die Rollen einmal zu notieren: Wer liefert das Terminal, wer zahlt aus, wer betreibt die Kasse, wer hat die Offerte gestellt. Mit einer Telefonnummer pro Rolle, an einem Ort, den jede Mitarbeiterin kennt. Einfacher ist ein Anbieter mit einem festen Ansprechpartner, der alle Rollen kennt und weiterleitet. Was die Rollen genau tun, steht unter [Rollen im Payment](/wissen/rollen-im-payment).
  - heading: 'Fehler 5: Erst hinschauen, wenn ein Problem da ist'
    body: |
      Ein Coiffeursalon nutzt sein Terminal seit Jahren. Eines Tages meldet es, dass es nicht mehr zugelassen ist, weil die Kartenorganisationen neue Sicherheitsanforderungen durchsetzen. Der Salon braucht innert Tagen ein neues Terminal, nimmt das erste Angebot und unterschreibt einen Vertrag mit Laufzeit, weil keine Zeit für einen Vergleich bleibt.

      Der Terminalwechsel ist angekündigt: Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung. Wer das heute weiss, hat Zeit, Offerten zu vergleichen, die Kündigungsfrist des alten Vertrags zu prüfen und den Wechsel auf einen ruhigen Monat zu legen. Die Gegenmassnahme ist eine schriftliche Frage an den heutigen Anbieter: Bleibt mein Terminal nach 2027 zugelassen, und was kostet der Ersatz. Ob Miete oder Kauf beim Ersatz sinnvoller ist, steht unter [Mieten oder kaufen](/wissen/mieten-oder-kaufen).
  - heading: 'Checkliste: Abrechnung einmal im Jahr prüfen'
    body: |
      Eine Monatsabrechnung, eine halbe Stunde, einmal im Jahr. Das reicht, um alle fünf Fehler zu vermeiden:

      - Kartenumsatz, Anzahl Zahlungen und Summe aller Gebühren inklusive Terminalkosten notieren.
      - Effektiven Satz berechnen: Gebühren geteilt durch Umsatz. Mit dem Vorjahreswert vergleichen.
      - Durchschnittsbetrag berechnen: Umsatz geteilt durch Anzahl Zahlungen. Hat er sich verändert, verändert sich die Wirkung eines Fixbetrags.
      - Kartenmix ablesen: Anteil Debit, Kredit, TWINT, Auslandkarten. Ein steigender Kreditanteil macht den Kreditsatz wichtiger.
      - Jede Position auf der Abrechnung einer Zeile der Offerte zuordnen. Was sich nicht zuordnen lässt, beim Anbieter schriftlich nachfragen.
      - Vertragslaufzeit und Kündigungsfrist prüfen. Datum notieren, bis wann gekündigt werden müsste.
      - Terminal prüfen: Zertifizierung, Zulassung nach 2027, Alter, Zustand des Akkus.
      - Anbindungen prüfen: Kommt der Betrag von der Kasse ans Terminal, oder wird abgetippt.
      - Zuständigkeiten prüfen: Liegt pro Rolle eine Telefonnummer vor, und kennt das Team sie.

      Wer den Vergleich nicht selbst rechnen will, schickt uns die Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine persönliche Vergleichsrechnung, und wir sagen Ihnen, ob wir günstiger sind oder nicht.
