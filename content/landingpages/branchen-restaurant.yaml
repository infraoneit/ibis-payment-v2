metaDescription: 'Zahlterminal für die Gastronomie: Trinkgeld und Belegsplitting am Tisch, Kassenanbindung an der Bar, 4G für die Terrasse. Genaue Sätze in der Offerte.'
kicker: Branche
lead: Trinkgeld und geteilte Rechnung direkt am Tisch, die Bar an die Kasse angebunden, und eine Abrechnung, die zum Tagesabschluss passt.
intro: |
  Im Restaurant entscheidet sich die Zahlung am Tisch. Der Gast will nicht an die Theke, der Service will nicht zweimal laufen, und bei einer Vierergruppe will jeder seinen Teil zahlen. Dazu kommt das Trinkgeld, das bei Kartenzahlung nur funktioniert, wenn das Terminal danach fragt.

  Ein grosser Teil der Zahlungen fällt am Abend in kurzer Zeit an. Ein Terminal, das in dieser Zeit hängt, kostet Tische. Es muss schnell reagieren, einen Akku für den ganzen Service haben und mit der Kasse sprechen, damit niemand Beträge abtippt.

  Wie der Preis zustande kommt, steht unter [Konditionen](/konditionen), die Offerte mit Ihren Zahlen erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: Zahlen am Tisch, nicht an der Theke
    body: |
      Der Gast verlangt die Rechnung, der Service bringt das Terminal mit. Ist die Kasse angebunden, kommt der Betrag von dort, sonst wird er eingetippt. Der Gast sieht den Betrag, beantwortet die Trinkgeldfrage, hält Karte oder Handy hin und gibt bei Bedarf die PIN ein. Der Beleg wird am Tisch gedruckt, beim N96 auf Wunsch mit Ihrem Logo.

      Für Gruppen gibt es das Belegsplitting: Der Service teilt die Rechnung auf dem Terminal in Teilbeträge, jeder Gast zahlt seinen Teil mit seiner Karte und erhält einen eigenen Beleg. TWINT läuft direkt auf dem Terminal, ebenso Reka und Lunch-Check.
  - heading: N96 am Tisch, CT20P an der Bar
    body: |
      Für den Service am Tisch empfehlen wir den [PayTec N96](/geraete/paytec-n96). Das 6.5-Zoll-Display ist gross genug für Trinkgeldeingabe und Belegsplitting, der Drucker schafft 80 Millimeter pro Sekunde, der Akku laut Datenblatt über 1500 Belege pro Ladung. 4G und WLAN sind eingebaut.

      Für Gartenwirtschaft und Festbetrieb, wo ein Terminal auch mal herunterfällt, ist der [PayTec N86](/geraete/paytec-n86) die robustere Wahl: mit Drucker, geprüft für Stürze aus 1.5 Metern auf Stein.

      An Bar und Theke steht der [PayTec CT20P](/geraete/paytec-ct20p). Er ist an die Kasse angebunden, hat ein physisches PIN-Pad für den Gast, druckt über den Kassendrucker und hängt am LAN, auf Wunsch mit Strom über das Netzwerkkabel.

      Faustregel: ein mobiles Terminal pro Servicebereich, dazu eines an der Bar. Alle Terminals gibt es als Miete oder Kauf, der Preis steht in der Offerte. Ob sich die Anzahl der Saison anpassen lässt, hängt von Laufzeit und Kündigung ab; beides steht im Vertrag mit SwiPay.
  - heading: Kassenanbindung, damit der Abschluss stimmt
    body: |
      Ohne Kassenanbindung tippt der Service jeden Betrag ab. Im Stossbetrieb entstehen so Zahlendreher, die am Abend als Differenz zwischen Kasse und Terminal auftauchen und eine halbe Stunde Suche kosten.

      Mit Anbindung übergibt die Kasse den Betrag ans Terminal, und die Kartenzahlungen stehen im Tagesabschluss der Kasse. In der Schweiz laufen diese Anbindungen über die Protokolle OPI, ZVT oder KIT. N96 und CT20P unterstützen alle drei.

      Ob Ihre Kasse eines der Protokolle spricht, klären wir vor der Inbetriebnahme mit Ihrem Kassenanbieter. ibis payment begleitet die Anbindung, bis die erste Zahlung durch die Kasse läuft. Wer die Kasse gleich mit erneuern will, findet unter [Kassensysteme](/kassensysteme) die Systeme, die wir anbieten.
  - heading: Trinkgeld und geteilte Rechnungen
    body: |
      Das Terminal fragt den Gast vor der Bestätigung nach einem Trinkgeld. Das Trinkgeld ist Teil der Kartenzahlung, wird mit dem Umsatz gutgeschrieben und mit demselben Satz belastet wie der Grundbetrag. Für die Zuordnung ans Team brauchen Sie die Liste der einzelnen Zahlungen aus dem Händlerportal; die Verbuchung klären Sie mit Ihrem Treuhänder.

      Beim Belegsplitting ist jede Teilzahlung eine eigene Zahlung und wird mit dem Satz der jeweiligen Karte abgerechnet. Ob zusätzlich ein fester Betrag pro Zahlung anfällt, steht in der Offerte. Fragen Sie danach, wenn bei Ihnen oft getrennt bezahlt wird, damit es auf der Abrechnung keine Überraschung gibt.
  - heading: Stosszeiten, Terrasse und Ausfall
    body: |
      Im Abendservice darf nichts hängen. Die mobilen Terminals haben WLAN und 4G; reicht das WLAN auf der Terrasse oder im Gewölbekeller nicht, läuft die Zahlung über das Mobilfunknetz. Vor der Inbetriebnahme prüfen wir mit Ihnen die Abdeckung am Zahlort.

      Legen Sie das Terminal nach jedem Service auf die Ladung, dann gibt es keine Diskussion. Als Reserve eignet sich ein [PayTec N62](/geraete/paytec-n62), ohne Drucker, mit Beleg per QR-Code. Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner, siehe [Support](/support).
  - heading: Abrechnung, Kartenmix und Wechsel
    body: |
      Restaurants sehen auf der Abrechnung oft viele Kreditkarten, und wer Touristen bedient, auch ausländische Karten. Der Kartenmix bestimmt deshalb den Preis. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in der Offerte, ebenso die Sätze für TWINT, ausländische Karten und American Express sowie der Preis für das Terminal als Miete oder Kauf.

      Die Umsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt. Die Abrechnung zeigt, über welchen Kanal sie kamen. Der [Rechner](/konditionen#rechner) schätzt mit Ihren Werten die mögliche Ersparnis als Spanne pro Monat und Jahr; die Beispielrechnung auf dieser Seite rechnet mit den dort genannten Annahmen für ein Restaurant.

      Für den Wechsel schicken Sie uns Ihre letzte Abrechnung über [Kontakt](/kontakt). Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung. Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Den Termin dafür legen wir mit Ihnen ausserhalb der Servicezeiten fest. Die Höchstsätze und den Rechner finden Sie unter [Konditionen](/konditionen).
