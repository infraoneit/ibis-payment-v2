faq:
  - frage: Wie viele Terminals braucht mein Restaurant?
    antwort: |
      Als Faustregel ein mobiles Terminal pro Servicebereich und eines an der Bar. Ob Sie für die Gartensaison ein Terminal dazunehmen und im Herbst wieder abgeben können, hängt von Laufzeit und Kündigung ab; beides steht im Vertrag mit SwiPay. Vor der Offerte klären wir mit Ihnen, wo im Betrieb bezahlt wird.
  - frage: Funktioniert das Terminal auf der Terrasse ohne WLAN?
    antwort: |
      Ja. N96 und N86 haben 4G eingebaut und zahlen über das Mobilfunknetz, wenn das WLAN nicht reicht. Vor der Inbetriebnahme prüfen wir mit Ihnen die Abdeckung am Zahlort.
  - frage: Kann der Gast das Trinkgeld selbst eingeben?
    antwort: |
      Ja. Das Terminal fragt vor der Bestätigung nach, der Gast gibt einen Betrag ein oder überspringt die Frage. Das Trinkgeld wird mit dem Umsatz gutgeschrieben und mit demselben Satz belastet wie der Grundbetrag.
  - frage: Was kostet es, wenn eine Gruppe getrennt zahlt?
    antwort: |
      Jede Teilzahlung ist eine eigene Zahlung und wird mit dem Satz der jeweiligen Karte abgerechnet: höchstens 0.85 % auf Debitkarten, höchstens 1.5 % auf Kreditkarten. Ob zusätzlich ein fester Betrag pro Zahlung anfällt, steht in der Offerte.
  - frage: Kann ich Reka und Lunch-Check annehmen?
    antwort: |
      Ja, alle Terminals nehmen Reka und Lunch-Check direkt an, ebenso TWINT, PostFinance Card, Apple Pay und Google Pay. Die Sätze für Reka und Lunch-Check stehen in der Offerte.
  - frage: Wie lange dauert der Wechsel?
    antwort: |
      Die Vergleichsrechnung zu Ihrer Abrechnung erhalten Sie innert 24 Stunden an Werktagen. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Den Zeitpunkt des Wechsels bestimmt die Kündigungsfrist Ihres heutigen Vertrags; den Termin legen wir ausserhalb der Servicezeiten.
