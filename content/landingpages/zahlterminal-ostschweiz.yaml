kicker: Ostschweiz
lead: ibis payment berät Betriebe in der ganzen Schweiz, auch in St. Gallen, Thurgau, Appenzell, Schaffhausen und Graubünden. Der Firmensitz ist in Abtwil SG.
intro: |
  In der Ostschweiz liegen viele Betriebe abseits: Hofläden mit Selbstbedienung, Bergrestaurants mit wechselndem Empfang, Dorfbäckereien, Gewerbe mit Werkstatt und Laden, Märkte und Feste mit saisonalem Umsatz. Dort zählt ein Terminal, das auch ohne WLAN zuverlässig zahlt.

  ibis payment vermittelt Terminals des Herstellers PayTec aus Effretikon, mit Abwicklung über das SwiPay-Bezahlnetzwerk. Der Firmensitz ist in Abtwil SG (Dufourpark 14, 9030 Abtwil), tätig ist ibis payment in der ganzen Schweiz. Wie der Preis zustande kommt, steht auf der Seite [Konditionen](/konditionen) und gilt in der Ostschweiz wie überall. Sie haben einen festen Ansprechpartner, von der ersten Beratung bis zur Inbetriebnahme.
sections:
  - heading: Beratung und Inbetriebnahme für Betriebe in der Ostschweiz
    body: |
      Der erste Schritt ist ein Gespräch, am Telefon oder nach Absprache im Betrieb. Es geht um den Zahlort: Tresen, Tisch, Kasse, Stand, Automat. Dann schicken Sie uns Ihre letzte Abrechnung oder drei Zahlen, und Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.

      Den Vertrag schliessen Sie mit der SwiPay AG; ibis payment berät, vermittelt und begleitet Sie bis zur Inbetriebnahme. Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Zur Inbetriebnahme gehören das Einrichten des Terminals, die Anbindung der Kasse über OPI, ZVT oder KIT, die Prüfung von WLAN und Mobilfunkempfang am Zahlort und eine Testzahlung. Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner.

      Für Winterthur und den Kanton Zürich gibt es eigene Seiten: [Zahlterminal Winterthur](/zahlterminal-winterthur) und [Zahlterminal Zürich](/zahlterminal-zuerich). Den Termin für das erste Gespräch vereinbaren Sie über [Kontakt](/kontakt).
  - heading: Typische Betriebe in der Ostschweiz
    body: |
      **Hofläden und Direktvermarkter.** Verkauf ab Hof, oft mit Selbstbedienung und ohne Personal. Für den bedienten Verkauf ein mobiles Terminal wie der [PayTec N62](/geraete/paytec-n62), das über 4G läuft, wo kein WLAN ist. Für die Selbstbedienung ein Automatenterminal, siehe unten.

      **Gastronomie und Tourismus.** Bergrestaurants, Hotels, Skihütten und Ausflugsziele haben Gäste aus dem In- und Ausland und oft schwankenden Empfang. Der [PayTec N96](/geraete/paytec-n96) mit Drucker und 18 Tagen Standby oder der [PayTec N86](/geraete/paytec-n86) mit Sturzschutz sind für lange Schichten und raue Umgebungen gebaut. Welche Sätze für ausländische Karten gelten, steht in der Offerte.

      **Dorfbäckereien, Metzgereien, Käsereien.** Viele kleine Zahlungen am Tresen. Der [PayTec V3CT3](/geraete/paytec-v3ct3) mit Tastatur und Drucker, auf Wunsch mit Kunden-Pinpad, oder der [PayTec CT20P](/geraete/paytec-ct20p) für Betriebe mit Kasse.

      **Gewerbe und Werkstätten.** Garagen, Schreinereien, Sanitär- und Elektrobetriebe mit Laden oder Rechnungszahlung am Tresen. Ein stationäres Terminal, bei Bedarf ein mobiles für den Service beim Kunden.

      **Märkte, Feste, Vereine.** Saisonaler Umsatz, Terminal für einige Wochen. Ob Miete, Kauf oder das Handy als Terminal passt, hängt von der Dauer ab; Laufzeit und Kündigung stehen im Vertrag mit SwiPay. Mehr unter [Zahlterminal mieten](/zahlterminal-mieten).
  - heading: Automaten und Selbstbedienung
    body: |
      Hofladen-Automaten, Selbstbedienungs-Kühlschränke, Getränkeautomaten, Parkplätze bei Ausflugszielen, Waschanlagen, Ladestationen: Dort zahlt der Kunde allein, oft im Freien und bei Minusgraden.

      Dafür gibt es zwei Terminals. Der [PayTec UN20](/geraete/paytec-un20) wird in den Automaten eingebaut, ist mit IP65 gegen Staub und Strahlwasser und mit IK10 gegen Schläge geschützt und läuft von minus 20 bis plus 70 Grad. Angebunden wird er über MDB oder RS232 an die Automatensteuerung. Der [PayTec N62 Vending](/geraete/paytec-n62-vending) ist die kompakte Variante für Automaten mit wenig Platz an geschützten Standorten.

      Beide nehmen Karten, Handy-Wallets und TWINT an und werden pro Projekt offeriert, weil Einbau und Anbindung je nach Automat verschieden sind. Ob UN20 oder N62 Vending passt, hängt vom Automaten, vom Standort und von der Steuerung ab. Das klären wir vor der Offerte.
  - heading: Was es kostet
    body: |
      Die Ostschweiz hat keine eigenen Preise. Was ein Betrieb zahlt, hängt von Umsatz und Kartenmix ab. Die Transaktionsgebühren betragen höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten; die genauen Sätze stehen in der Offerte. Das Terminal gibt es als Miete oder Kauf, der Preis steht ebenfalls in der Offerte. Automatenterminals werden pro Projekt offeriert.

      Für saisonale Betriebe zählt, was in den schwachen Monaten gilt. Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Die Kartenumsätze werden in Schweizer Franken auf Ihr Geschäftskonto ausbezahlt; die Abrechnung zeigt, über welchen Kanal sie kamen.

      Der [Rechner](/konditionen#rechner) schätzt in 60 Sekunden die mögliche Ersparnis als Spanne pro Monat und Jahr. Die Beispielrechnung auf dieser Seite rechnet mit den Annahmen für einen Hofladen mit kleinem Umsatz und tiefem Kreditkartenanteil. Haben Sie heute schon ein Terminal, schicken Sie uns die Abrechnung. Sie erhalten innert 24 Stunden an Werktagen eine Antwort mit persönlicher Vergleichsrechnung.
  - heading: Verbindung, wo kein WLAN ist
    body: |
      Am Hof, auf der Alp und im Festzelt gibt es selten WLAN. Die mobilen Terminals von PayTec haben 4G eingebaut und brauchen nur Mobilfunkempfang. Wo beides vorhanden ist, wechseln sie automatisch zwischen WLAN und 4G. Ob der Empfang am Zahlort reicht, klären wir vor der Inbetriebnahme, nicht erst am ersten Markttag.

      Stationäre Terminals in Läden und Werkstätten brauchen LAN oder stabiles WLAN. Für Netzwerk und WLAN arbeiten wir mit InfraOne IT Solutions in Winterthur zusammen.

      Wer ein älteres Terminal hat, sollte den Wechsel nicht aufschieben, denn ältere Modelle verlieren mit der Zeit ihre Zulassung. Worauf Sie beim Vergleich der Anbieter achten müssen, steht auf der Seite [Zahlterminal Vergleich](/zahlterminal-vergleich).
