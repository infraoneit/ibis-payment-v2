faq:
  - frage: Berät ibis payment auch abgelegene Betriebe in der Ostschweiz?
    antwort: |
      Ja. ibis payment berät Betriebe in der ganzen Schweiz, auch in den Kantonen St. Gallen, Thurgau, Appenzell, Schaffhausen und Graubünden. Das Gespräch findet am Telefon oder nach Absprache im Betrieb statt. Der Firmensitz ist in Abtwil SG.
  - frage: Funktioniert das Terminal auf dem Hof oder auf der Alp ohne WLAN?
    antwort: |
      Ja, die mobilen Terminals haben 4G eingebaut. Ob der Mobilfunkempfang am Zahlort reicht, klären wir vor der Inbetriebnahme. Für Automaten im Freien hat der UN20 einen Anschluss für eine externe Antenne.
  - frage: Welches Terminal passt für einen Hofladen mit Selbstbedienung?
    antwort: |
      Ein Automatenterminal, das in den Verkaufsautomaten oder Kühlschrank eingebaut wird: der UN20 für den Aussenbereich, der N62 Vending für geschützte Standorte. Beide werden pro Projekt offeriert, weil die Anbindung an die Automatensteuerung je nach Modell verschieden ist.
  - frage: Sind die Konditionen in der Ostschweiz anders als in Zürich?
    antwort: |
      Nein. Überall gelten dieselben Höchstsätze: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab, nicht vom Standort, und stehen in der Offerte. Mehr unter [Konditionen](/konditionen).
  - frage: Kann ich das Terminal nur für die Saison mieten?
    antwort: |
      Das klären wir in der Offerte. Terminals gibt es als Miete oder Kauf; Laufzeit und Kündigung stehen im Vertrag mit SwiPay, wir zeigen sie Ihnen vor der Unterschrift. Sagen Sie uns bei der Anfrage, in welchen Monaten Sie das Terminal brauchen.
  - frage: Was passiert in der Ostschweiz bei einem Defekt am Terminal?
    antwort: |
      Bei einer Störung wenden Sie sich an Ihren festen Ansprechpartner. Was im Störungsfall gilt, steht im Vertrag mit SwiPay. Als Überbrückung kommt das Handy als Terminal in Frage, siehe [Handy als Terminal](/handy-als-terminal).
