metaDescription: 'TWINT direkt auf dem Zahlterminal: Betrag vom Terminal, Zahlung auf derselben Abrechnung wie die Karten. Der Satz für TWINT steht in Ihrer Offerte.'
kicker: TWINT
lead: TWINT läuft direkt auf dem Terminal, ohne separaten QR-Aufsteller. Der Betrag kommt vom Terminal, die Zahlung landet auf derselben Abrechnung wie die Karten.
intro: |
  In vielen Betrieben wird TWINT noch über einen Aufsteller abgewickelt: ein Kleber oder Ständer mit statischem QR-Code, bei dem der Kunde den Betrag selbst eintippt, dazu ein separates TWINT-Händlerkonto mit eigener Abrechnung. Das funktioniert, kostet aber Zeit und Kontrolle.

  Auf den Terminals, die ibis payment vermittelt, ist TWINT integriert. Der Betrag wird am Terminal eingegeben oder von der Kasse übergeben, das Display zeigt den QR-Code, der Kunde scannt ihn mit der TWINT-App, und die Bestätigung erscheint bei Ihnen. Den Satz für TWINT nennen wir in der Offerte; die Höchstsätze für Karten stehen auf der Seite [Konditionen](/konditionen).
sections:
  - heading: So läuft TWINT auf dem Terminal
    body: |
      Der Ablauf ist derselbe wie bei einer Kartenzahlung. Sie geben den Betrag ein oder die Kasse übergibt ihn. Der Kunde sagt, dass er mit TWINT zahlt, Sie wählen TWINT am Terminal. Das Display zeigt einen QR-Code mit dem Betrag, der Kunde scannt ihn in der App und bestätigt. Das Terminal meldet die Zahlung, der Beleg wird gedruckt oder digital verschickt.

      Gegenüber dem Aufsteller ändert sich dreierlei. Der Betrag kommt vom Terminal, nicht vom Kunden, Tippfehler und Rückfragen entfallen. Sie sehen die Bestätigung auf Ihrem Terminal, nicht auf dem Handy des Kunden. Und die Zahlung steht im Tagesabschluss des Terminals und in der Kasse, nicht in einem zweiten System.

      TWINT läuft auf den mobilen und stationären Modellen, die wir vermitteln, vom kompakten [PayTec N62](/geraete/paytec-n62) bis zum kassenintegrierten [PayTec CT20P](/geraete/paytec-ct20p). Bei Automatenterminals wie dem [PayTec UN20](/geraete/paytec-un20) klären wir die Zahlungsmittel pro Projekt.
  - heading: TWINT Gebühren für Händler
    body: |
      Für TWINT auf dem Terminal fällt wie bei Karten eine Gebühr pro Zahlung an. Den Satz nennen wir nicht auf der Website. Er steht in Ihrer Offerte, neben den Sätzen für Debit- und Kreditkarten. Für diese gelten Höchstsätze: höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen ebenfalls in der Offerte.

      TWINT läuft direkt über das Terminal und wird zusammen mit den Karten abgerechnet. Den Vertrag schliessen Sie mit der SwiPay AG; Laufzeit und Kündigung stehen dort, wir zeigen sie Ihnen vor der Unterschrift. Die Gutschrift erfolgt in Schweizer Franken auf Ihr Geschäftskonto.

      Beim Vergleich mit anderen Anbietern rechnen Sie die TWINT-Umsätze zu den Kartenumsätzen dazu. Fragen Sie bei jedem Angebot, ob TWINT auf dem Terminal läuft oder über einen Aufsteller mit separatem Konto und separater Gebühr. Die Beispielrechnung auf dieser Seite zeigt ein Café mit kleinem Bon. Den TWINT-Anteil Ihres Betriebs lesen Sie aus Ihrer heutigen Abrechnung.
  - heading: Eine Abrechnung statt zwei
    body: |
      Mit einem Aufsteller kommt TWINT oft von einem anderen Anbieter als die Kartenzahlungen. Das heisst zwei Verträge, zwei Abrechnungen, zwei Gutschriften, zwei Ansprechpartner. Wer in der Buchhaltung die Tageseinnahmen mit den Gutschriften abstimmt, kennt den Aufwand.

      Läuft TWINT über das Terminal, stehen TWINT, Debitkarten, Kreditkarten, PostFinance Card, Reka und Lunch-Check auf derselben Abrechnung. Sie zeigt, über welchen Kanal die Umsätze kamen. Die Gutschrift kommt von einer Stelle, in Schweizer Franken auf Ihr Geschäftskonto. Ihr Treuhänder hat eine Quelle statt zwei.

      Den Aufsteller können Sie parallel behalten, etwa für Zahlungen ausserhalb der Öffnungszeiten. Sie haben dann weiterhin zwei Abrechnungen.
  - heading: TWINT im Webshop
    body: |
      Für Online-Zahlungen arbeiten wir mit dem Gateway Planet/Datatrans: über 40 Zahlungsmethoden, darunter TWINT, PostFinance, Karten, Apple Pay und Google Pay, mit 14 Plugins für die gängigen Shopsysteme. Der Kunde wählt im Checkout TWINT, bestätigt in der App, und die Bestellung ist bezahlt.

      Die Konditionen online unterscheiden sich von denen am Terminal. Sie stehen in der Offerte. Wer ein Terminal im Betrieb und einen Webshop hat, bekommt beides über einen Ansprechpartner, der beide Seiten kennt. Details auf der Seite [Online-Zahlungen](/online-zahlungen).
  - heading: Warum das Handy als Terminal kein TWINT kann
    body: |
      Mit der App Softpay wird ein Android-Handy zum Terminal, ohne zusätzliche Hardware. Das ist praktisch für Lieferdienste, Marktfahrer oder als Reserve. Die App nimmt Visa, Mastercard, American Express, Apple Pay und Google Pay an. TWINT und PostFinance Card kann sie nicht.

      Beide setzen in der Schweiz ein ep2-zertifiziertes Terminal voraus, und das Handy ist keines. Es nutzt seinen NFC-Chip für kontaktlose Kartenzahlungen, mehr nicht.

      Für einen Betrieb mit Laufkundschaft ist das ein Argument für ein Terminal, auch wenn das Handy auf den ersten Blick einfacher wirkt. Wer nur Karten braucht, findet die Details unter [Handy als Terminal](/handy-als-terminal). Welche Variante zu Ihrem Betrieb passt, klären wir über [Kontakt](/kontakt).
