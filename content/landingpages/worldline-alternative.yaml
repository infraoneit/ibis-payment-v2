kicker: Wechsel
lead: Wer von Worldline zu einem anderen Terminalanbieter wechseln will, braucht zwei Dinge. Einen Vergleich auf Basis der eigenen Abrechnung und einen klaren Ablauf für die Kündigung.
intro: |
  Worldline ist in der Schweiz ein etablierter Anbieter für Terminals und Acquiring und hat das Kartengeschäft von SIX Payment Services übernommen; manche Betriebe kennen ihren Vertrag deshalb noch unter dem Namen SIX. Oft wurde er vor Jahren abgeschlossen und seither nicht mehr angeschaut. Das ist der Normalfall, kein Vorwurf.

  Diese Seite ist für Betriebe, die eine Worldline Alternative prüfen. Sie zeigt, wie Sie Ihre heutige Abrechnung lesen, worauf Sie bei der Kündigungsfrist achten müssen und wie der Wechsel abläuft. Aussagen über Preise und Bedingungen von Worldline machen wir nicht. Massgebend ist, was in Ihrem Vertrag und auf Ihrer Abrechnung steht.

  Ob sich ein Wechsel lohnt, entscheidet Ihre Abrechnung. Schicken Sie sie über [Abrechnung einreichen](/konditionen#abrechnung). An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit einer persönlichen Vergleichsrechnung.
sections:
  - heading: Was Ihre Abrechnung zeigt
    body: |
      Was Sie heute zahlen, steht nicht in einer Preisliste, sondern auf Ihrer Abrechnung. Konditionen für Terminals und Acquiring werden häufig individuell offeriert. Zwei Betriebe beim selben Anbieter können deshalb unterschiedliche Sätze haben.

      Wer vergleichen will, liest die eigene Abrechnung: Umsatz pro Kartenart, Anzahl Zahlungen, Gebühr pro Kartenart, Terminalmiete, Fixbeträge, Monats- und Mindestgebühren, Zuschläge für Auslandkarten. Teilen Sie die Summe aller Gebühren eines Monats durch den Kartenumsatz. Das ist Ihr effektiver Satz über alle Karten, und nur der lässt sich mit einem anderen Angebot vergleichen.

      Jede Gebühr besteht aus drei Anteilen: der Interchange für die Bank, die die Karte herausgegeben hat, der Scheme Fee für Visa oder Mastercard und der Acquiring-Gebühr des Anbieters. Die Interchange ist in der Schweiz reguliert und hängt nicht vom Anbieter ab. Die Angebote unterscheiden sich vor allem im dritten Anteil. Die geltenden Sätze mit Quelle stehen im Artikel [Kartenzahlung Gebühren Schweiz](/wissen/kartenzahlung-gebuehren-schweiz).
  - heading: Was Sie bei ibis payment erhalten
    body: |
      **Veröffentlichte Höchstsätze.** Auf Debitkarten zahlen Sie höchstens 0.85 %, auf Kreditkarten höchstens 1.5 %. Die genauen Sätze hängen von Umsatz und Kartenmix ab und stehen in Ihrer Offerte, ebenso der Preis für das Terminal in Miete und Kauf. Die Übersicht steht auf der Seite [Konditionen](/konditionen).

      **Ein fester Ansprechpartner.** Eine Person für alle Themen, vom Terminal über die Kasse bis zur Abrechnung. Bei einer Störung meldet sie sich bei Ihnen.

      **Begleitung bis zur Inbetriebnahme.** ibis berät, vermittelt und begleitet: Terminal einrichten, Kasse über OPI, ZVT oder KIT anbinden, WLAN prüfen, Testzahlung machen.

      **Klarheit vor der Unterschrift.** Den Vertrag schliessen Sie mit der SwiPay AG. Laufzeit und Kündigung stehen in diesem Vertrag; wir zeigen sie Ihnen, bevor Sie unterschreiben. Die Gutschrift erfolgt in Schweizer Franken auf Ihr Geschäftskonto.

      Dazu kommt die Vergleichsrechnung mit Ihrer Abrechnung. Liegt das Angebot nicht unter dem, was Sie heute zahlen, sagen wir Ihnen das.
  - heading: Kündigungsfrist prüfen, bevor Sie wechseln
    body: |
      Der häufigste Fehler beim Anbieterwechsel ist, die Kündigungsfrist zu spät zu lesen. Nehmen Sie Ihren Vertrag hervor und prüfen Sie fünf Punkte:

      - Laufzeit des Acquiring-Vertrags und Datum des Vertragsbeginns.
      - Kündigungsfrist, und ob sie sich auf das Vertragsende oder auf das Monatsende bezieht.
      - Verlängerungsklausel: Um wie viele Monate oder Jahre verlängert sich der Vertrag, wenn nicht gekündigt wird.
      - Terminalmiete: Ist sie ein separater Vertrag mit eigener Laufzeit, oder hängt sie am Acquiring-Vertrag.
      - Form der Kündigung: schriftlich, per Brief, per E-Mail, an welche Adresse.

      Diese Angaben stehen in den Vertragsbedingungen, nicht auf der Abrechnung. Finden Sie sie nicht, schicken Sie uns den Vertrag mit der Abrechnung. Wir prüfen die Frist mit Ihnen und planen den Wechsel auf den Stichtag. Läuft der Vertrag noch länger, rechnen wir vor, ob sich ein früherer Ausstieg trotz Restlaufzeit lohnt oder ob Sie den Wechsel auf das Vertragsende legen.
  - heading: So läuft der Wechsel ab
    body: |
      Der Wechsel läuft in fünf Schritten. Den ersten machen Sie selbst, bei den übrigen begleiten wir Sie.

      - **Abrechnung schicken.** Ihre letzte Monatsabrechnung, als PDF oder Foto, über [Abrechnung einreichen](/konditionen#abrechnung). An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit einer persönlichen Vergleichsrechnung auf Basis derselben Umsätze.
      - **Offerte und Vertrag.** In der Offerte steht jede Gebühr einzeln. Sie wählen das Modell und Miete oder Kauf, siehe [Geräte](/geraete). Den Vertrag schliessen Sie mit der SwiPay AG.
      - **Kündigung.** Wir prüfen mit Ihnen die Kündigungsfrist beim bisherigen Anbieter und stimmen den Stichtag ab.
      - **Inbetriebnahme am Stichtag.** Ab Eingang des Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen. Ihr Ansprechpartner richtet das neue Terminal mit Ihnen ein, bindet die Kasse an und macht eine Testzahlung. Das alte Terminal geht an den bisherigen Anbieter zurück; wie, steht in dessen Vertrag.
      - **Erste Abrechnung.** Vergleichen Sie die erste Abrechnung mit der Offerte. Versteckte Kosten gibt es nicht: Was verrechnet wird, steht in der Offerte.

      Die Beispielrechnung auf dieser Seite zeigt ein Restaurant mit mittlerem Bon. Im Rechner weiter unten setzen Sie Ihre eigenen Zahlen ein. Kennen Sie Ihre heutige Gebühr aus der Abrechnung, tragen Sie sie dort ein.
  - heading: Was beim Wechsel gleich bleibt
    body: |
      Ein Wechsel des Terminalanbieters ändert nichts daran, womit Ihre Kundschaft bezahlt. Visa, Mastercard, Maestro, V Pay, PostFinance Card, TWINT, Apple Pay, Google Pay, Reka und Lunch-Check laufen auf den Terminals von PayTec wie auf jedem ep2-zertifizierten Terminal.

      Die Kassenanbindung läuft in der Schweiz über die Protokolle OPI, ZVT und KIT. Welches Protokoll Ihre Kasse spricht, klären wir vor der Inbetriebnahme; die Kassensysteme, die wir kennen, stehen unter [Kassensysteme](/kassensysteme).

      Was sich ändert: das Terminal, das Bezahlnetzwerk (SwiPay mit TeleCash/Fiserv als Acquirer), die Abrechnung, der Ansprechpartner und die Gebühren. Ob sich die Gebühren zu Ihren Gunsten ändern, zeigt die Vergleichsrechnung. Wenn nicht, sagen wir es Ihnen, und Sie bleiben, wo Sie sind.
