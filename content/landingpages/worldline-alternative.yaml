faq:
  - frage: Kann ich mit laufendem Worldline-Vertrag wechseln?
    antwort: |
      Ja, aber erst auf das Ende der Kündigungsfrist. Wir prüfen Ihren Vertrag mit Ihnen und legen den Wechsel auf den Stichtag. Läuft der Vertrag noch lange, rechnen wir vor, ob sich ein früherer Ausstieg lohnt.
  - frage: Was kostet der Wechsel von Worldline zu ibis payment?
    antwort: |
      Alle Kosten auf unserer Seite stehen in der Offerte, bevor Sie unterschreiben. Versteckte Kosten gibt es nicht. Was beim bisherigen Anbieter bei vorzeitiger Kündigung anfällt, steht in dessen Vertrag. Beides gehört in die Vergleichsrechnung.
  - frage: Kann ich mein Worldline-Terminal behalten?
    antwort: |
      Das hängt von Modell, Zertifizierung und Eigentum ab. Ein gemietetes Terminal geht an den bisherigen Anbieter zurück. Schicken Sie uns Modell und Baujahr, wir klären es. Sonst erhalten Sie ein Terminal von PayTec, in Miete oder Kauf; der Preis steht in der Offerte.
  - frage: Funktionieren TWINT und PostFinance Card nach dem Wechsel weiter?
    antwort: |
      Ja. Alle Terminals, die wir vermitteln, sind ep2-zertifiziert und wickeln TWINT direkt auf dem Terminal, PostFinance Card, Reka und Lunch-Check ab. Die Zahlungen erscheinen auf derselben Abrechnung wie Debit- und Kreditkarten.
  - frage: Wie erkenne ich, ob sich ein Wechsel lohnt?
    antwort: |
      Schicken Sie uns Ihre letzte Monatsabrechnung. An Werktagen erhalten Sie innert 24 Stunden eine Antwort mit einer persönlichen Vergleichsrechnung auf Basis derselben Umsätze. Liegt das Angebot nicht unter Ihrer heutigen Abrechnung, sagen wir Ihnen das.
  - frage: Bleibt meine Kasse angebunden?
    antwort: |
      Ja, wenn Ihre Kasse OPI, ZVT oder KIT spricht. Die Anbindung richten wir bei der Inbetriebnahme ein. Details unter [Kassensysteme](/kassensysteme).
