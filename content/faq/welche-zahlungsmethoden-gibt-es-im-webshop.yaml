frage: Welche Zahlungsmethoden gibt es im Webshop?
antwort: Über das Zahlungs-Gateway Planet/Datatrans stehen über 40 Zahlungsmethoden bereit, darunter TWINT, PostFinance, Kredit- und Debitkarten, Apple Pay und Google Pay sowie Rechnung. Für Shop-Systeme gibt es 14 fertige Plugins. Die Abrechnung zeigt, über welchen Kanal die Umsätze kamen.
bereich: online
