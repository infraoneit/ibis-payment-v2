frage: Was ist, wenn ich am Wochenende Hilfe brauche?
antwort: Sie melden sich bei Ihrem festen Ansprechpartner; er ist für alle Themen zuständig. ibis payment ist von 07:30 bis 22:00 Uhr erreichbar. Hat Ihr Betrieb am Wochenende geöffnet, sagen Sie uns das im ersten Gespräch. Wir klären dann vor der Inbetriebnahme, wie Sie an diesen Tagen Hilfe erhalten.
