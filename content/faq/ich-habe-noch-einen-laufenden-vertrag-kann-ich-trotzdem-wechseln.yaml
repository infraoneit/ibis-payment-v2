frage: Ich habe noch einen laufenden Vertrag. Kann ich trotzdem wechseln?
antwort: Ja. Wir schauen mit Ihnen Restlaufzeit und Kündigungsfrist des bisherigen Vertrags an und planen den Wechsel auf das Vertragsende. Bis dahin läuft Ihr altes Terminal weiter. Ab Eingang des neuen Vertrags dauert es im Normalfall 72 Stunden bis zur ersten Zahlung, sofern alle Unterlagen vorliegen.
bereich: support
