frage: Was kostet der Wechsel vom bisherigen Anbieter?
antwort: 'Das hängt von Ihrem bisherigen Vertrag ab: Restlaufzeit und Kündigungsfrist bestimmen, ob beim alten Anbieter noch Kosten anfallen. Wir schauen den Vertrag mit Ihnen an und rechnen vor, ob sich ein früherer Ausstieg trotz Restlaufzeit lohnt. Was beim neuen Vertrag anfällt, steht in der Offerte.'
bereich: konditionen
reihenfolge: 3
