frage: Terminal kaufen oder mieten?
antwort: Beides ist möglich. Bei der Miete bleibt das Terminal Eigentum des Anbieters, beim Kauf gehört es Ihnen. Der Preis für Miete oder Kauf steht in der Offerte. Was für Wartung, Updates und einen Defekt gilt, regelt der Vertrag mit SwiPay; wir zeigen es Ihnen vor der Unterschrift. Die Abwägung steht unter [Mieten oder kaufen](/wissen/mieten-oder-kaufen).
