frage: Gibt es Mindestumsätze oder Mindestgebühren?
antwort: SwiPay nimmt Betriebe unabhängig von der Umsatzhöhe auf. Ob eine Mindestgebühr gilt, steht in der Offerte. Die Transaktionsgebühren liegen bei höchstens 0.85 % auf Debitkarten und höchstens 1.5 % auf Kreditkarten; die genauen Sätze hängen von Umsatz und Kartenmix ab.
bereich: konditionen
reihenfolge: 2
