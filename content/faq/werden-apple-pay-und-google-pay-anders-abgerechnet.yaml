frage: Werden Apple Pay und Google Pay anders abgerechnet?
antwort: Nein. Eine Zahlung mit dem Handy ist eine Zahlung mit der hinterlegten Karte. Ist eine Debitkarte hinterlegt, gilt der Debitsatz, bei einer Kreditkarte der Kreditsatz. Die genauen Sätze stehen in der Offerte.
bereich: konditionen
reihenfolge: 6
