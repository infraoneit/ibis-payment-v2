frage: Was passiert, wenn das Terminal ausfällt?
antwort: Sie melden sich bei Ihrem festen Ansprechpartner. Er klärt mit Ihnen, ob sich die Störung aus der Ferne beheben lässt und wie es weitergeht. Was bei einem Defekt des Geräts gilt, steht im Vertrag mit SwiPay. Ob das Handy als Terminal (SoftPOS) als Überbrückung in Frage kommt, klären wir mit Ihnen.
bereich: support
reihenfolge: 1
